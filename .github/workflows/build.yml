# ===========================================================================
# 自動ビルド：src/ などを変更して push すると、GitHub が自動で
#   ① 構文チェック（@babel/standalone 7.24.7）
#   ② npm run build で index.html を生成
#   ③ index.html が変わっていればコミットして公開（GitHub Pages）
# までやります。構文エラーがあれば ② で止まり、公開中の画面は壊れません。
# ===========================================================================
name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 構文チェック＋ビルド
        run: npm run build

      - name: index.html が変わっていればコミット
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html に変化なし（コミット不要）"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: index.html を自動生成"
          git push
