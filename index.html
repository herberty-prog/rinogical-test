/* ===========================================================================
   Firebase 連携（設定はここ1か所にまとめる。後から実プロジェクトの値に差し替え）
   - Artifactサンドボックスや未設定時は自動でローカル動作（保存しない）にフォールバック
   - エラーはconsoleに出すだけで、アプリは止めない
   =========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD7uAY50Bef2575lxjzuV5IBdahgzrhV7c",
  authDomain: "rinogical.firebaseapp.com",
  projectId: "rinogical",
  storageBucket: "rinogical.firebasestorage.app",
  messagingSenderId: "510843207944",
  appId: "1:510843207944:web:91a3b0095bd69203e3ecbd",
};

const FIREBASE_VER = "11.0.2"; // CDNから読むSDKのバージョン

/* 実行時に解決される firestore 関数の入れ物 */
const fb = { ready: false, db: null, doc: null, getDoc: null, setDoc: null, serverTimestamp: null,
  auth: null, authMod: null, uid: null, isAnonymous: true, email: null };
let _memDeviceId = null; // localStorageが使えない環境用の一時ID

/* 設定がプレースホルダーのままかどうか */
function firebaseConfigured() {
  return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("YOUR_");
}

/* デバイスごとのユニークID。localStorageに保存。使えなければメモリに退避 */
function getDeviceId() {
  const KEY = "rino_device_id";
  const make = () => {
    try { if (crypto?.randomUUID) return "dev-" + crypto.randomUUID(); } catch (e) {}
    return "dev-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  };
  try {
    let id = localStorage.getItem(KEY);
    if (!id) { id = make(); localStorage.setItem(KEY, id); }
    return id;
  } catch (e) {
    console.warn("[Rinogical] localStorage不可。一時IDで動作します:", e && e.message);
    if (!_memDeviceId) _memDeviceId = make();
    return _memDeviceId;
  }
}

/* Firebase初期化（CDNから動的import）。失敗時はローカル動作 */
async function initFirebase() {
  if (!firebaseConfigured()) {
    console.info("[Rinogical] Firebase未設定 → ローカル動作モード（保存なし）");
    return false;
  }
  try {
    const appMod = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-app.js`);
    const fsMod = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-firestore.js`);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    fb.db = fsMod.getFirestore(app);
    fb.doc = fsMod.doc; fb.getDoc = fsMod.getDoc; fb.setDoc = fsMod.setDoc; fb.serverTimestamp = fsMod.serverTimestamp;
    fb.ready = true;
    console.info("[Rinogical] Firebase接続OK");
    await initAuth(app);
    return true;
  } catch (e) {
    console.error("[Rinogical] Firebase初期化に失敗 → ローカル動作で続行:", e);
    return false;
  }
}

/* Firestoreから users/{deviceId} を読む。無ければ null */
async function loadUserData(deviceId) {
  if (!fb.ready) return null;
  try {
    const snap = await fb.getDoc(fb.doc(fb.db, "users", deviceId));
    return snap.exists() ? snap.data() : null;
  } catch (e) {
    console.error("[Rinogical] 読み込み失敗:", e);
    return null;
  }
}

/* Firestoreへ保存（merge）。updatedAtはサーバー時刻 */
async function saveUserData(deviceId, data, opt) {
  if (!fb.ready || !deviceId) return;
  try {
    await fb.setDoc(
      fb.doc(fb.db, "users", deviceId),
      { ...data, updatedAt: fb.serverTimestamp() },
      { merge: !(opt && opt.replace) }
    );
  } catch (e) {
    console.error("[Rinogical] 保存失敗:", e);
  }
}


/* ===========================================================================
   ログイン（2026-11〜）：匿名ログインで始め、あとで「メール＋パスワード」をひも付けられる（C方式）
   - セーブの置き場所は users/{ログインのuid}。ログインできないとき（Firebase側で未有効など）は
     従来どおり users/{端末ID} を使う（＝今までと同じ動き。安全に段階導入するため）
   - 初回：uid側にセーブが無く、端末ID側にあれば、uid側へ自動でコピー（端末ID側は消さない）
   =========================================================================== */
async function initAuth(app) {
  try {
    const am = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-auth.js`);
    fb.authMod = am;
    fb.auth = am.getAuth(app);
    // 前回のログイン状態の復元を待つ（ここで待たないと毎回新しい匿名ユーザーができてしまう）
    let user = await new Promise(resolve => {
      const off = am.onAuthStateChanged(fb.auth, u => { off(); resolve(u); });
    });
    if (!user) user = (await am.signInAnonymously(fb.auth)).user;
    setAuthUser(user);
    console.info("[Rinogical] ログインOK:", user.isAnonymous ? "匿名" : user.email);
  } catch (e) {
    fb.uid = null;
    console.warn("[Rinogical] ログインできないため端末IDで保存します:", e && (e.code || e.message));
  }
}

function setAuthUser(user) {
  fb.uid = user ? user.uid : null;
  fb.isAnonymous = user ? user.isAnonymous : true;
  fb.email = user ? (user.email || null) : null;
}

/* 起動時に呼ぶ：どこに保存するか（key）と、読み込んだセーブ（data）を返す */
async function loadSaveData() {
  const deviceId = getDeviceId();
  if (!fb.ready || !fb.uid) return { key: deviceId, data: await loadUserData(deviceId) };
  let force = false;
  try { force = localStorage.getItem("rino_force_migrate") === "1"; } catch (e) {}
  let data = force ? null : await loadUserData(fb.uid);
  if (!data || !data.nickname) {
    const legacy = await loadUserData(deviceId);
    if (legacy && legacy.nickname) {
      const copy = { ...legacy };
      delete copy.updatedAt;
      await saveUserData(fb.uid, { ...copy, migratedFrom: deviceId }, { replace: true });
      data = copy;
      console.info("[Rinogical] 端末IDのセーブをログイン側へ引っ越しました:", deviceId);
    } else if (force) {
      data = await loadUserData(fb.uid);
    }
  }
  try { localStorage.removeItem("rino_force_migrate"); } catch (e) {}
  return { key: fb.uid, data };
}

async function registerEmail(email, password) {
  if (!fb.auth || !fb.auth.currentUser) throw { code: "auth/admin-restricted-operation" };
  const am = fb.authMod;
  const cred = am.EmailAuthProvider.credential(email.trim(), password);
  const res = await am.linkWithCredential(fb.auth.currentUser, cred);
  setAuthUser(res.user);
  return res.user;
}
/* 登録済みのメールでログイン（別の端末・アイコンを消したあと用）。セーブが切り替わるので呼んだ側で再起動する */
async function loginEmail(email, password) {
  if (!fb.auth) throw { code: "auth/admin-restricted-operation" };
  const res = await fb.authMod.signInWithEmailAndPassword(fb.auth, email.trim(), password);
  setAuthUser(res.user);
  return res.user;
}

/* ================= Lottie再生部品（lottie-web を遅延読み込み）=================
   ・src があれば再生。読み込み失敗・ライブラリ未読込なら onFail を呼んで何も描かない
     （呼び出し側＝Heroが従来表示にフォールバックする）。
   ・lottie-web は importmap（esm.sh）で追加する必要がある（index.html側）。 */
function LottieView({ src, size = 200, loop = true, onFail }) {
  const box = useRef(null);
  useEffect(() => {
    if (!src) { if (onFail) onFail(); return; }
    var anim = null; var alive = true;
    import("lottie-web").then(function (mod) {
      if (!alive || !box.current) return;
      var lottie = mod.default || mod;
      anim = lottie.loadAnimation({
        container: box.current,
        renderer: "svg",
        loop: loop,
        autoplay: true,
        path: src,
      });
      anim.addEventListener("data_failed", function () { if (onFail) onFail(); });
    }).catch(function () { if (onFail) onFail(); });
    return function () { alive = false; if (anim) anim.destroy(); };
  }, [src, loop]);
  return <div ref={box} style={{ width: size, height: size, margin: "0 auto" }} />;
}

    "rino-float 3.2s ease-in-out infinite";
  const mouth =
    mood === "happy" ? "M78 138 Q100 168 122 138" :
    mood === "sad" ? "M80 150 Q100 134 120 150" :
    "M84 142 Q100 156 116 142";
  // ① Lottieがあればそれを再生（mood別→idle→画像→SVG の順にフォールバック）
  const lottiePick = lottieSet ? (lottieSet[mood] || lottieSet.idle || null) : null;
  if (lottiePick && !lottieErr) {
    return (
      <div style={{ width: size, height: size, position: "relative" }}>
        {mood === "happy" && [0, 1, 2, 3].map(i => (
          <Sparkles key={i} size={20 + i * 4} color={C.gold}
            style={{ position: "absolute", top: 10 + (i % 2) * 120, left: i < 2 ? -6 : size - 26,

        ))}
        <LottieView src={lottiePick} size={size} loop={mood === "idle"} onFail={() => setLottieErr(true)} />
      </div>
    );
  }
  // ② 画像があればそれを表示（読み込み失敗時は下のSVGに自動フォールバック）
  if (src && !imgErr) {
    return (
      <div style={{ width: size, height: size, position: "relative" }}>

          <Sparkles key={i} size={20 + i * 4} color={C.gold}

        {/* 猫耳 */}

        <path d="M148 56 L160 16 L116 44 Z" fill="url(#ha)" />
        <path d="M54 50 L48 28 L74 44 Z" fill={C.pink} opacity=".8" />
        <path d="M146 50 L152 28 L126 44 Z" fill={C.pink} opacity=".8" />
        {/* 体・セーラー */}
        <path d="M58 150 Q100 130 142 150 L150 196 Q100 208 50 196 Z" fill="url(#ha)" />
        <path d="M70 142 L100 168 L130 142 L122 178 L78 178 Z" fill="#fbf7ff" />

        {/* 目 */}
        <ellipse cx="80" cy="104" rx="9" ry="12" fill="#2b1f4a" />

}

function HPBar({ label, value, max, color }) {

      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: C.inkDim, marginBottom: 4, fontWeight: 700 }}>

}

/* ================= 図を出すしくみ（フェーズ5・数学の図形・グラフ・データ）=================
   問題に fig: { type, ... } を持たせると、バトル画面の問題文の上に図（SVG）を出す。fig が無ければ何も出さない。
   ・sector  … おうぎ形   { r, deg }            半径 r cm・中心角 deg°
   ・circle  … 円         { r }
   ・coord   … 座標とグラフ { kind: "line" | "hyper" | "none", a, pts: [[x, y, "A"], ...] }
   ・bars    … ヒストグラム { edges: [0,10,20,...], counts: [..], unit: "点" }
   ・solid   … 立体の見取図 { kind: "cuboid" | "cube" | "prism3" | "cylinder" | "cone" | "pyramid" | "sphere", labels: {...} }
   ※図は「目安」。長さの比はおおよそでよく、数値はラベルで示す（図の長さで答えを読ませない）。 */
function Figure({ fig }) {
  if (!fig) return null;
  const W = 240, H = 170;
  const stroke = C.aqua, txt = C.ink, sub = C.inkDim, fill = "rgba(110,231,224,.14)";
  const label = (x, y, s, o = {}) => (
    <text key={o.key} x={x} y={y} fill={o.color || txt} fontSize={o.size || 13} fontWeight="800" textAnchor={o.anchor || "middle"}
      dominantBaseline="middle" stroke={C.bg0} strokeWidth="4" strokeLinejoin="round" paintOrder="stroke"
      style={{ fontFamily: "inherit" }}>{s}</text>
  );
  let body = null;

  if (fig.type === "sector" || fig.type === "circle") {
    const cx = W / 2, cy = H / 2 + 6, R = 62;
    if (fig.type === "circle") {
      body = (<>
        <circle cx={cx} cy={cy} r={R} fill={fill} stroke={stroke} strokeWidth="3" />
        <line x1={cx} y1={cy} x2={cx + R} y2={cy} stroke={C.gold} strokeWidth="3" />
        <circle cx={cx} cy={cy} r="3" fill={txt} />
        {label(cx + R / 2, cy - 12, `${fig.r}cm`, { color: C.gold })}
      </>);
    } else {
      const deg = fig.deg, rad = (a) => (a - 90) * Math.PI / 180; // 上向きから時計回り
      const a0 = -deg / 2, a1 = deg / 2;
      const p = (a) => [cx + R * Math.cos(rad(a)), cy + R * Math.sin(rad(a))];
      const [x0, y0] = p(a0), [x1, y1] = p(a1);
      const large = deg > 180 ? 1 : 0;
      // 半径のラベルは、右側の半径の中点から外向き（図の外側）にずらす。中心角は図の内側に小さな弧で示す
      const nx = Math.cos(rad(a1 + 90)), ny = Math.sin(rad(a1 + 90));
      const q = (a, rr) => [cx + rr * Math.cos(rad(a)), cy + rr * Math.sin(rad(a))];
      const [s0x, s0y] = q(a0, 14), [s1x, s1y] = q(a1, 14), [dx, dy] = q(0, 30);
      body = (<>
        <path d={`M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} Z`} fill={fill} stroke={stroke} strokeWidth="3" />
        <path d={`M ${s0x} ${s0y} A 14 14 0 ${large} 1 ${s1x} ${s1y}`} fill="none" stroke={C.peach} strokeWidth="2" />
        <circle cx={cx} cy={cy} r="3" fill={txt} />
        {label((cx + x1) / 2 + nx * 16, (cy + y1) / 2 + ny * 16, `${fig.r}cm`, { color: C.gold })}
        {deg < 150 ? label(cx, cy + 18, `${deg}°`, { color: C.peach, size: 12 }) : label(dx, dy, `${deg}°`, { color: C.peach, size: 12 })}
      </>);
    }
  }

  if (fig.type === "coord") {
    const cx = W / 2, cy = H / 2, s = 12; // 1目もり 12px、-6〜6
    const X = (x) => cx + x * s, Y = (y) => cy - y * s;
    const grid = [];
    for (let i = -6; i <= 6; i++) {
      grid.push(<line key={"v" + i} x1={X(i)} y1={Y(-6.5)} x2={X(i)} y2={Y(6.5)} stroke="rgba(255,255,255,.08)" />);
      grid.push(<line key={"h" + i} x1={X(-6.5)} y1={Y(i)} x2={X(6.5)} y2={Y(i)} stroke="rgba(255,255,255,.08)" />);
    }
    let graph = null;
    if (fig.kind === "line") {
      const xm = Math.min(6.5, 6.5 / Math.max(1, Math.abs(fig.a)));
      graph = <line x1={X(-xm)} y1={Y(-xm * fig.a)} x2={X(xm)} y2={Y(xm * fig.a)} stroke={C.gold} strokeWidth="3" />;
    } else if (fig.kind === "hyper") {
      const pts = (sgn) => {
        const out = [];
        for (let x = 0.3; x <= 6.5; x += 0.1) {
          const y = fig.a / (sgn * x);
          if (Math.abs(y) <= 6.5) out.push(`${X(sgn * x)},${Y(y)}`);
        }
        return out.join(" ");
      };
      graph = <>{[1, -1].map(sg => <polyline key={sg} points={pts(sg)} fill="none" stroke={C.gold} strokeWidth="3" />)}</>;
    }
    body = (<>
      {grid}
      <line x1={X(-6.5)} y1={cy} x2={X(6.5)} y2={cy} stroke={sub} strokeWidth="1.5" />
      <line x1={cx} y1={Y(-6.5)} x2={cx} y2={Y(6.5)} stroke={sub} strokeWidth="1.5" />
      {label(X(6.5) + 8, cy, "x", { color: sub, size: 12 })}
      {label(cx, Y(6.5) - 6, "y", { color: sub, size: 12 })}
      {label(cx - 7, cy + 8, "O", { color: sub, size: 10 })}
      {graph}
      {(fig.pts || []).map(([x, y, nm], i) => (
        <g key={i}>
          <circle cx={X(x)} cy={Y(y)} r="4" fill={C.peach} />
          {nm && label(X(x) + 12, Y(y) - 9, nm, { color: C.peach, size: 12 })}
        </g>
      ))}
    </>);
  }

  if (fig.type === "bars") {
    const n = fig.counts.length, max = Math.max(...fig.counts, 1);
    const left = 26, bottom = H - 26, top = 14, bw = (W - left - 34) / n; // 右はしに単位を書くすき間
    const hY = (c) => bottom - (bottom - top) * c / max;
    body = (<>
      <line x1={left} y1={bottom} x2={left + n * bw + 6} y2={bottom} stroke={sub} strokeWidth="1.5" />
      <line x1={left} y1={top} x2={left} y2={bottom} stroke={sub} strokeWidth="1.5" />
      {fig.counts.map((c, i) => (
        <g key={i}>
          <rect x={left + i * bw} y={hY(c)} width={bw} height={bottom - hY(c)} fill={fill} stroke={stroke} strokeWidth="2" />
          {label(left + i * bw + bw / 2, hY(c) - 9, String(c), { color: C.gold, size: 12 })}
        </g>
      ))}
      {fig.edges.map((e, i) => label(left + i * bw, bottom + 12, String(e), { color: sub, size: 10, key: "e" + i }))}
      {label(W - 4, bottom - 10, fig.unit ? `（${fig.unit}）` : "", { color: sub, size: 10, anchor: "end" })}
    </>);
  }

  if (fig.type === "solid") {
    const L = fig.labels || {}, k = fig.kind;
    const sw = { stroke, strokeWidth: 2.5, fill: "none" };
    const dash = { stroke, strokeWidth: 1.5, strokeDasharray: "4 4", fill: "none" };
    if (k === "cuboid" || k === "cube" || k === "prism3") {
      const x0 = 50, y0 = 130, w = k === "cube" ? 90 : 110, h = k === "cube" ? 80 : 70, dx = 40, dy = -30;
      if (k === "prism3") {
        // 三角柱：手前の三角形と奥の三角形
        const A = [x0, y0], B = [x0 + w, y0], T = [x0 + w / 2, y0 - h];
        const o = (P) => [P[0] + dx, P[1] + dy];
        body = (<>
          <polygon points={[A, B, T].map(p => p.join(",")).join(" ")} {...sw} fill={fill} />
          <polyline points={[B, o(B), o(T), T].map(p => p.join(",")).join(" ")} {...sw} />
          <line x1={T[0]} y1={T[1]} x2={o(T)[0]} y2={o(T)[1]} {...sw} />
          <polyline points={[A, o(A), o(B)].map(p => p.join(",")).join(" ")} {...dash} />
          <line x1={o(A)[0]} y1={o(A)[1]} x2={o(T)[0]} y2={o(T)[1]} {...dash} />
          {L.base && label(x0 + w / 2, y0 + 14, L.base, { color: C.gold })}
          {L.h && label(x0 + w / 2 - 4, y0 - h / 2 + 10, L.h, { color: C.peach, size: 12 })}
          {L.d && label(x0 + w + dx / 2 + 14, y0 + dy / 2, L.d, { color: C.gold })}
        </>);
      } else {
        const P = [[x0, y0], [x0 + w, y0], [x0 + w, y0 - h], [x0, y0 - h]];
        const o = (p) => [p[0] + dx, p[1] + dy];
        body = (<>
          <polygon points={P.map(p => p.join(",")).join(" ")} {...sw} fill={fill} />
          <polyline points={[P[1], o(P[1]), o(P[2]), o(P[3]), P[3]].map(p => p.join(",")).join(" ")} {...sw} />
          <line x1={P[2][0]} y1={P[2][1]} x2={o(P[2])[0]} y2={o(P[2])[1]} {...sw} />
          <polyline points={[P[0], o(P[0]), o(P[1])].map(p => p.join(",")).join(" ")} {...dash} />
          <line x1={o(P[0])[0]} y1={o(P[0])[1]} x2={o(P[3])[0]} y2={o(P[3])[1]} {...dash} />
          {L.w && label(x0 + w / 2, y0 + 14, L.w, { color: C.gold })}
          {L.h && label(x0 - 20, y0 - h / 2, L.h, { color: C.gold })}
          {L.d && label(x0 + w + dx / 2 + 16, y0 + dy / 2, L.d, { color: C.gold })}
        </>);
      }
    } else if (k === "cylinder" || k === "cone") {
      const cx = W / 2, by = 135, rx = 52, ry = 14, h = 100;
      body = (<>
        {k === "cylinder" ? (<>
          <ellipse cx={cx} cy={by - h} rx={rx} ry={ry} {...sw} fill={fill} />
          <line x1={cx - rx} y1={by - h} x2={cx - rx} y2={by} {...sw} />
          <line x1={cx + rx} y1={by - h} x2={cx + rx} y2={by} {...sw} />
        </>) : (<>
          <line x1={cx} y1={by - h} x2={cx - rx} y2={by} {...sw} />
          <line x1={cx} y1={by - h} x2={cx + rx} y2={by} {...sw} />
          <line x1={cx} y1={by - h} x2={cx} y2={by} {...dash} />
        </>)}
        <path d={`M ${cx - rx} ${by} A ${rx} ${ry} 0 0 0 ${cx + rx} ${by}`} {...sw} />
        <path d={`M ${cx - rx} ${by} A ${rx} ${ry} 0 0 1 ${cx + rx} ${by}`} {...dash} />
        <line x1={cx} y1={by} x2={cx + rx} y2={by} stroke={C.gold} strokeWidth="2" />
        {L.r && label(cx + rx / 2, by + ry + 10, L.r, { color: C.gold })}
        {L.h && (k === "cone"
          ? label(cx + 5, by - h * 0.3, L.h, { color: C.peach, size: 12, anchor: "start" })
          : label(cx + rx + 22, by - h / 2, L.h, { color: C.peach }))}
      </>);
    } else if (k === "pyramid") {
      const x0 = 55, y0 = 135, w = 100, dx = 40, dy = -26, apex = [x0 + (w + dx) / 2, 20];
      const A = [x0, y0], B = [x0 + w, y0], Cc = [x0 + w + dx, y0 + dy], D = [x0 + dx, y0 + dy];
      const centre = [(A[0] + Cc[0]) / 2, (A[1] + Cc[1]) / 2];
      body = (<>
        <polyline points={[A, B, Cc].map(p => p.join(",")).join(" ")} {...sw} />
        <polyline points={[A, D, Cc].map(p => p.join(",")).join(" ")} {...dash} />
        {[A, B, Cc].map((p, i) => <line key={i} x1={apex[0]} y1={apex[1]} x2={p[0]} y2={p[1]} {...sw} />)}
        <line x1={apex[0]} y1={apex[1]} x2={D[0]} y2={D[1]} {...dash} />
        <line x1={apex[0]} y1={apex[1]} x2={centre[0]} y2={centre[1]} stroke={C.peach} strokeWidth="1.5" strokeDasharray="3 3" />
        {L.base && label(x0 + w / 2, y0 + 14, L.base, { color: C.gold })}
        {L.h && label(centre[0] + 20, (apex[1] + centre[1]) / 2, L.h, { color: C.peach })}
      </>);
    } else if (k === "sphere") {
      const cx = W / 2, cy = H / 2 + 4, R = 64;
      body = (<>
        <circle cx={cx} cy={cy} r={R} {...sw} fill={fill} />
        <path d={`M ${cx - R} ${cy} A ${R} 16 0 0 0 ${cx + R} ${cy}`} {...sw} />
        <path d={`M ${cx - R} ${cy} A ${R} 16 0 0 1 ${cx + R} ${cy}`} {...dash} />
        <line x1={cx} y1={cy} x2={cx + R} y2={cy} stroke={C.gold} strokeWidth="2" />
        <circle cx={cx} cy={cy} r="3" fill={txt} />
        {L.r && label(cx + R / 2, cy - 12, L.r, { color: C.gold })}
      </>);
    }
  }

  if (!body) return null;
  return (
    <div style={{ display: "flex", justifyContent: "center", margin: "4px 0 8px" }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxWidth: 300 }} role="img" aria-label="図">{body}</svg>
    </div>
  );
}

/* ================= 問題エンジン（正負の数）================= */
const rint = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const fmt = (n) => (n < 0 ? `(${n})` : `${n}`);

function genKihon(level) {
  const r = Math.min(5 + level * 2, 14);
  const a = rint(-r, r), b = rint(-r, r);
  const useMul = level >= 3 && Math.random() < 0.4;
  if (useMul) {
    const x = rint(-6, 6), y = rint(-6, 6);
    return { q: `${fmt(x)} × ${fmt(y)}`, a: x * y, kind: "超基本" };
  }
  const op = Math.random() < 0.5 ? "+" : "-";
  return { q: `${fmt(a)} ${op} ${fmt(b)}`, a: op === "+" ? a + b : a - b, kind: "超基本" };
}

/* ---- 数学の「型＋ランダムな数」で標準問題をつくる共通部品（フェーズ4）----
   term(係数, 文字, 先頭か)：2x / -x / x のような項の表示。先頭以外は " + 2x" / " - x" の形。
   cst(定数)：" + 5" / " - 3"（0 のときは空）。
   nz(lo, hi)：0 をのぞいた整数。 */
function term(k, v, first) {
  const abs = Math.abs(k);
  const body = (abs === 1 ? "" : String(abs)) + v;
  if (first) return (k < 0 ? "-" : "") + body;
  return (k < 0 ? " - " : " + ") + body;
}
function cst(n) { return n === 0 ? "" : (n > 0 ? ` + ${n}` : ` - ${-n}`); }
function nz(lo, hi) { let n = 0; while (n === 0) n = rint(lo, hi); return n; }
function pickOne(arr) { return arr[rint(0, arr.length - 1)]; }

/* フェーズ5の理科・社会で使う部品：1問1行の表（{ q, a, ng:[ダミー3つ], adv, why }）から4択を1問つくる。
   adv:true は発展で、Lv3 以降だけ出す。ダミーは表に手で書く（自動で借りると正解が2つになることがある） */
function genTableProblem(data, level) {
  const pool = level >= 3 ? data : data.filter(d => !d.adv);
  const d = pickOne(pool);
  return { type: "text", ui: "choice", kind: d.adv ? "発展" : "基本", q: d.q, a: d.a, choices: shuffle([d.a].concat(d.ng)), why: d.why };
}

/* フェーズ5の数学（比例・データ・図形）で使う部品
   piStr(k)：円周率をふくむ答えの表し方（1 → "π"、6 → "6π"）。tools/verify.mjs も同じ表し方で検算する。
   choices4(答え, 候補)：答え＋候補から重ならない3つで4択をつくる（候補が足りなければ数を足して埋める）。 */
function piStr(k) { return k === 1 ? "π" : `${k}π`; }
function choices4(ans, cands) {
  const out = [ans];
  for (const c of cands) { if (out.length >= 4) break; if (c !== undefined && c !== null && !out.some(o => String(o) === String(c))) out.push(c); }
  let g = 1;
  while (out.length < 4 && typeof ans === "number") { const c = ans + g * 2; if (!out.includes(c)) out.push(c); g++; }
  return shuffle(out);
}

/* 正負の数の標準：型を7つ持ち、数はその場で決める。4回に1回は固定の HYOJUN からも出す。
   答えはすべて整数（わり算は割り切れる数だけ作る）。tools/verify.mjs が式を計算して検算する。 */
function genStd_seifu(level) {
  if (Math.random() < 0.25) return genFromPool(HYOJUN);
  const t = rint(1, 7);
  let q, a;
  if (t === 1) {        // 3つの数のたし算・ひき算
    const x = nz(-15, 15), y = nz(-15, 15), z = nz(-15, 15);
    const o1 = pickOne(["+", "-"]), o2 = pickOne(["+", "-"]);
    q = `${fmt(x)} ${o1} ${fmt(y)} ${o2} ${fmt(z)}`;
    a = (o1 === "+" ? x + y : x - y); a = (o2 === "+" ? a + z : a - z);
  } else if (t === 2) { // 2つの数のかけ算（どちらかは負）
    const x = nz(-9, 9), y = rint(2, 9) * (x > 0 ? -1 : pickOne([1, -1]));
    q = `${fmt(x)} × ${fmt(y)}`; a = x * y;
  } else if (t === 3) { // わり算（割り切れる）
    const d = rint(2, 9) * pickOne([1, -1]), ans = nz(-9, 9);
    q = `${fmt(d * ans)} ÷ ${fmt(d)}`; a = ans;
  } else if (t === 4) { // 3つの数のかけ算
    const x = nz(-5, 5), y = nz(-5, 5), z = nz(-4, 4);
    q = `${fmt(x)} × ${fmt(y)} × ${fmt(z)}`; a = x * y * z;
  } else if (t === 5) { // 累乗：(-n)² / -n² / (-n)³ / -n³
    const f = rint(1, 4), n = f <= 2 ? rint(2, 6) : rint(2, 4);
    if (f === 1) { q = `(-${n})²`; a = n * n; }
    else if (f === 2) { q = `-${n}²`; a = -n * n; }
    else if (f === 3) { q = `(-${n})³`; a = -n * n * n; }
    else { q = `-${n}³`; a = -n * n * n; }
  } else if (t === 6) { // 絶対値
    const x = nz(-12, 12), y = nz(-12, 12), f = rint(1, 3);
    if (f === 1) { q = `|${x}| + |${y}|`; a = Math.abs(x) + Math.abs(y); }
    else if (f === 2) { q = `|${x}| - |${y}|`; a = Math.abs(x) - Math.abs(y); }
    else { q = `|${x} - ${fmt(y)}|`; a = Math.abs(x - y); }
  } else {              // 四則の混じった計算（かけ算を先に）
    const x = nz(-6, 6), y = nz(-6, 6), z = nz(-12, 12);
    if (Math.random() < 0.5) { q = `${fmt(x)} × ${fmt(y)} + ${fmt(z)}`; a = x * y + z; }
    else { q = `${fmt(z)} - ${fmt(x)} × ${fmt(y)}`; a = z - x * y; }
  }
  return { q, a, kind: "標準" };
}
const genHyojun = () => ({ ...HYOJUN[rint(0, HYOJUN.length - 1)], kind: "標準" });

function shuffle(arr) { return arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]); }
function makeChoices(answer) {
  const set = new Set([answer]);
  const cands = [-answer, answer + 1, answer - 1, answer + 2, answer - 2, answer + (answer === 0 ? 3 : 0)];
  for (const c of shuffle(cands)) { if (set.size >= 4) break; if (!set.has(c)) set.add(c); }
  let g = 1; while (set.size < 4) { set.add(answer + g * 3); set.add(answer - g * 3); g++; }
  return shuffle([...set].slice(0, 4));
}

/* 回答方式の決定：答えが整数の問題だけ「入力」にできる（分数・小数・式は4択）。
   レベルが上がるほど入力の比率を上げる（Lv1-2=4択のみ / Lv3-4=約30% / Lv5+=約50%）。 */
function pickAnswerMode(level, ans) {
  if (!Number.isInteger(ans)) return "choice";
  const p = level >= 5 ? 0.5 : level >= 3 ? 0.3 : 0;
  return Math.random() < p ? "input" : "choice";
}

/* 入力をやさしく解釈：全角数字・全角マイナス・空白を吸収して整数に */
function parseInput(s) {
  if (s == null) return null;
  let t = String(s).trim()
    .replace(/[０-９]/g, d => "０１２３４５６７８９".indexOf(d).toString())
    .replace(/[ー－−—‐]/g, "-")
    .replace(/[＋]/g, "+")
    .replace(/\s/g, "");
  if (t === "" || t === "-" || t === "+") return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/* 受付係（Cloudflare Worker）のURL。ここ1か所だけで定義する。 */
const AI_PROXY_URL = "https://rinogical-ai.jet-speeder-herberty.workers.dev";

async function callClaude(messages, system) {
  // 1回ぶんのリクエスト
  const once = async () => {
    const res = await fetch(AI_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system: system, messages: messages }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ("proxy " + res.status));
    return data.text || "";
  };
  try {
    return await once();
  } catch (e) {
    // 一時的な通信エラーや500のときは、少し待って「1回だけ」自動で再試行する。
    // それでもダメなら投げる（呼び出し側がローカル解説などにフォールバックする）。
    await new Promise(r => setTimeout(r, 600));
    return await once();
  }
}

/* iPhone のキーボードは ' を ’ に変えることがある（don’t）。どちらも同じ ' として扱う */
function normText(s) {
  return String(s == null ? "" : s).trim().toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/\s+/g, " ").replace(/[.．。!?！？]+$/,"");
}
/* p.alts … 入力問題で、正解として認める別の書き方（例：can't のほかに cannot）。4択では使わない */
function sameAns(val, p) {
  if (p && p.type === "number") return val === p.a;
  const v = normText(val);
  return v === normText(p.a) || (p && p.ui === "input" && (p.alts || []).some(x => v === normText(x)));
}

  else if (level >= 3) form = roll < 0.7 ? "choice" : "arrange";
  else form = "choice";

  const { s, be, pred } = engPick();
  const CH = ["am", "is", "are", "be"];

  if (form === "arrange") {

    return { type: "text", ui: "arrange", kind: "ならべかえ", q: "", a: words.join(" "), tiles: shuffle(words.slice()), end: "." };
  }
  if (form === "input") {
    return { type: "text", ui: "input", kind: "入力", q: `${s} ___ ${pred}.`, a: be, choices: CH };
  }

}

const EN_SUBJ_ALL = EN_SUBJ_I.concat(EN_SUBJ_PL, EN_SUBJ_3);
/* 疑問文の主語（Do I 〜? / Are Ken and I 〜? は不自然なので使わない） */
const EN_SUBJ_ASK = EN_SUBJ_ALL.filter(x => x.s !== "I" && x.s !== "Ken and I");
/* 文の途中に置くときの主語（You → you、My friends → my friends。I・Tom・Ken and I・Mr. Sato はそのまま） */
const enLow = (w) => (/^(You|We|They|He|She|It|My)\b/.test(w) ? w.charAt(0).toLowerCase() + w.slice(1) : w);
/* 「Do you 〜? — Yes, I do.」の聞き手と答え手。I は you で聞き、Ken and I は you（あなたたち）で聞いて we で答える */
const enWho = (S) => S.s === "I" ? { q: "you", a: "I" } : S.s === "Ken and I" ? { q: "you", a: "we" } : { q: enLow(S.s), a: S.pron };
/* ほかの動詞を1つ（4択のダミー用） */
const enOtherVerb = (v) => pickOne(EN_VERBS.filter(x => x.b !== v.b));
const enCap = (w) => w.charAt(0).toUpperCase() + w.slice(1);

/* 出題形式をレベルで決める（be動詞の単元と同じ割合）：Lv1-2=4択 / Lv3-4=4択+ならべかえ / Lv5+=4択+ならべかえ+入力 */
function enForm(level) {
  const r = Math.random();
  if (level >= 5) return r < 0.5 ? "choice" : r < 0.8 ? "arrange" : "input";
  if (level >= 3) return r < 0.7 ? "choice" : "arrange";
  return "choice";
}
const enChoice = (q, a, ng, kind) => ({ type: "text", ui: "choice", kind, q, a, choices: shuffle([a].concat(ng)) });
const enInput = (q, a, alts) => ({ type: "text", ui: "input", kind: "入力", q, a, alts: alts || [] });
/* ならべかえ：札の配列（主語は1枚）。正解は札をスペースでつないだ文（文末の . ? はつけない） */
/* end … 文の最後につく記号。札には入れず、画面の並べる枠の右はしに表示する（疑問文は「?」、ふつうの文は「.」） */
const EN_ASK_WORDS = /^(Do|Does|Did|Can|Is|Are|Am|Was|Were|What|Who|Where|When|How|Whose|Which)$/;
const enArrange = (tiles) => ({ type: "text", ui: "arrange", kind: "ならべかえ", q: "", a: tiles.join(" "), tiles: shuffle(tiles.slice()),
  end: EN_ASK_WORDS.test(tiles[0]) ? "?" : "." });
const enWords = (str) => str.split(" ");

/* ---------- 一般動詞（I / you / 複数の主語。三人称単数は別の単元） ---------- */
function genEnIppan(level) {
  const v = pickOne(EN_VERBS), o = pickOne(v.objs);
  const S = pickOne(EN_SUBJ_I.concat(EN_SUBJ_PL));
  const A = pickOne(EN_SUBJ_PL.filter(x => x.s !== "Ken and I")); // 疑問文の主語
  const form = enForm(level);
  const t = level >= 3 ? rint(1, 5) : 1;
  if (form === "arrange") {
    if (t === 2) return enArrange([S.s, "don't", v.b, ...enWords(o)]);
    if (t >= 3) return enArrange(["Do", enLow(A.s), v.b, ...enWords(o)]);
    return enArrange([S.s, v.b, ...enWords(o)]);
  }
  if (form === "input") {
    return enInput(`（否定文に）${S.s} ${v.b} ${o}. → ${S.s} ___ ${v.b} ${o}.`, "don't", ["do not"]);
  }
  if (t === 2) return enChoice(`${S.s} ___ ${v.b} ${o}.`, "don't", ["doesn't", S.be === "am" ? "am not" : "aren't", "not"], "標準");
  if (t === 3) return enChoice(`___ ${enLow(A.s)} ${v.b} ${o}?`, "Do", ["Does", "Are", "Is"], "標準");
  if (t === 4) {
    const yes = Math.random() < 0.5;
    const who = enWho(S);
    return enChoice(`Do ${who.q} ${v.b} ${o}? — ${yes ? "Yes" : "No"}, ${who.a} ___.`, yes ? "do" : "don't",
      yes ? ["does", who.a === "I" ? "am" : "are", "is"] : ["doesn't", who.a === "I" ? "am not" : "aren't", "isn't"], "標準");
  }
  // be動詞はダミーに使わない（I am a dog. / You are English. のように文として成り立ってしまうことがある）
  return enChoice(`${S.s} ___ ${o}.`, v.b, [v.s, v.ing, enOtherVerb(v).s], "超基本");
}

/* ---------- can ---------- */
function genEnCan(level) {
  const v = pickOne(EN_CAN_VERBS), o = pickOne(v.objs);
  const S = pickOne(EN_SUBJ_ALL);
  const form = enForm(level);
  const t = level >= 3 ? rint(1, 5) : rint(1, 2);
  if (form === "arrange") {
    if (t === 3) return enArrange([S.s, "can't", v.b, ...enWords(o)]);
    if (t >= 4) { const A = pickOne(EN_SUBJ_ASK); return enArrange(["Can", enLow(A.s), v.b, ...enWords(o)]); }
    return enArrange([S.s, "can", v.b, ...enWords(o)]);
  }
  if (form === "input") {
    const neg = Math.random() < 0.5;
    return neg ? enInput(`（〜できない）${S.s} ___ ${v.b} ${o}.`, "can't", ["cannot", "can not"])
      : enInput(`（〜できる）${S.s} ___ ${v.b} ${o}.`, "can");
  }
  // do / does は選択肢に入れない（He does swim fast. も文として正しくなるため）
  if (t === 2) return enChoice(`${S.s} can ___ ${o}.`, v.b, [v.s, v.ing, v.p], "超基本");
  if (t === 3) return enChoice(`${S.s} ___ ${v.b} ${o}.（〜できない）`, "can't", ["isn't", "aren't", "not"], "標準");
  if (t === 4) { const A = pickOne(EN_SUBJ_ASK); return enChoice(`___ ${enLow(A.s)} ${v.b} ${o}?`, "Can", ["Is", "Are", "Am"], "標準"); }
  if (t === 5) {
    const yes = Math.random() < 0.5;
    const who = enWho(S);
    return enChoice(`Can ${who.q} ${v.b} ${o}? — ${yes ? "Yes" : "No"}, ${who.a} ___.`, yes ? "can" : "can't",
      yes ? ["cans", "is", "am"] : ["isn't", "aren't", "not"], "標準");
  }
  return enChoice(`${S.s} ___ ${v.b} ${o}.`, "can", ["cans", S.be, S.be === "is" ? "are" : "is"], "超基本");
}

/* ---------- 三人称単数（he / she / Tom など） ---------- */
function genEnSansho(level) {
  const v = pickOne(EN_VERBS), o = pickOne(v.objs);
  const S = pickOne(EN_SUBJ_3);
  const form = enForm(level);
  const t = level >= 3 ? rint(1, 5) : 1;
  if (form === "arrange") {
    if (t === 2) return enArrange([S.s, "doesn't", v.b, ...enWords(o)]);
    if (t >= 3) return enArrange(["Does", enLow(S.s), v.b, ...enWords(o)]);
    return enArrange([S.s, v.s, ...enWords(o)]);
  }
  if (form === "input") return enInput(`（${v.b}）${S.s} ___ ${o}.`, v.s);
  if (t === 2) return enChoice(`${S.s} ___ ${v.b} ${o}.`, "doesn't", ["don't", "isn't", "not"], "標準");
  if (t === 3) return enChoice(`${S.s} doesn't ___ ${o}.`, v.b, [v.s, v.ing, "is"], "標準");
  if (t === 4) return enChoice(`___ ${enLow(S.s)} ${v.b} ${o}?`, "Does", ["Do", "Is", "Are"], "標準");
  if (t === 5) {
    const yes = Math.random() < 0.5;
    return enChoice(`Does ${enLow(S.s)} ${v.b} ${o}? — ${yes ? "Yes" : "No"}, ${S.pron} ___.`, yes ? "does" : "doesn't",
      yes ? ["do", "is", v.s] : ["don't", "isn't", "not"], "標準");
  }
  // be動詞はダミーに使わない（He is English. のように成り立つことがある）。s のつかない形はどれも不正解
  return enChoice(`${S.s} ___ ${o}.`, v.s, [v.b, v.ing, enOtherVerb(v).b], "超基本");
}

/* ---------- 現在進行形（now をつけて、ふつうの現在形と区別する） ---------- */
function genEnShinkou(level) {
  const v = pickOne(EN_VERBS.filter(x => x.prog)), o = pickOne(v.objs);
  const S = pickOne(EN_SUBJ_ALL);
  const form = enForm(level);
  const t = level >= 3 ? rint(1, 5) : rint(1, 2);
  if (form === "arrange") {
    if (t === 3) return enArrange([S.s, S.be + " not", v.ing, ...enWords(o)]);
    if (t >= 4) { const A = pickOne(EN_SUBJ_ASK); return enArrange([enCap(A.be), enLow(A.s), v.ing, ...enWords(o), "now"]); }
    return enArrange([S.s, S.be, v.ing, ...enWords(o), "now"]);
  }
  if (form === "input") return enInput(`（${v.b}）${S.s} ${S.be} ___ ${o} now.`, v.ing);
  const others = ["am", "is", "are"].filter(x => x !== S.be);
  if (t === 2) return enChoice(`${S.s} ${S.be} ___ ${o} now.`, v.ing, [v.b, v.s, v.p], "超基本");
  if (t === 3) return enChoice(`${S.s} ___ not ${v.ing} ${o} now.`, S.be, others.concat(["do"]), "標準");
  if (t === 4) {
    const A = pickOne(EN_SUBJ_ASK);
    return enChoice(`___ ${enLow(A.s)} ${v.ing} ${o} now?`, enCap(A.be), ["am", "is", "are"].filter(x => x !== A.be).map(enCap).concat(["Do"]), "標準");
  }
  if (t === 5) {
    const T = pickOne(EN_SUBJ_3);
    return enChoice(`What is ${enLow(T.s)} doing now? — ${enCap(T.pron)} is ___ ${o}.`, v.ing, [v.b, v.s, v.p], "標準");
  }
  return enChoice(`${S.s} ___ ${v.ing} ${o} now.`, S.be, others.concat(["be"]), "超基本");
}

/* ---------- 過去形（yesterday などで、現在形と区別する） ---------- */
const EN_PAST_TIME = ["yesterday", "last Sunday", "last night"];
function genEnKako(level) {
  const v = pickOne(EN_VERBS.filter(x => x.prog)), o = pickOne(v.objs); // like / have は「きのう〜した」が不自然なので使わない
  const S = pickOne(EN_SUBJ_ALL);
  const when = pickOne(EN_PAST_TIME);
  const form = enForm(level);
  const t = level >= 3 ? rint(1, 6) : rint(1, 2);
  if (form === "arrange") {
    if (t === 3) return enArrange([S.s, "didn't", v.b, ...enWords(o), ...enWords(when)]);
    if (t >= 4) { const A = pickOne(EN_SUBJ_ASK); return enArrange(["Did", enLow(A.s), v.b, ...enWords(o), ...enWords(when)]); }
    return enArrange([S.s, v.p, ...enWords(o), ...enWords(when)]);
  }
  if (form === "input") return enInput(`（${v.b}）${S.s} ___ ${o} ${when}.`, v.p);
  if (t === 2) { // be動詞の過去
    const adj = pickOne(["busy", "tired", "happy", "sleepy", "at home", "in the gym"]);
    const ng = S.was === "was" ? ["were", S.be, S.be === "is" ? "are" : "is"] : ["was", "are", "is"];
    return enChoice(`${S.s} ___ ${adj} ${when}.`, S.was, ng, "超基本");
  }
  if (t === 3) return enChoice(`${S.s} ___ ${v.b} ${o} ${when}.`, "didn't", ["don't", "doesn't", S.was === "was" ? "wasn't" : "weren't"], "標準");
  if (t === 4) return enChoice(`${S.s} didn't ___ ${o} ${when}.`, v.b, [v.p, v.s, v.ing], "標準");
  if (t === 5) { const A = pickOne(EN_SUBJ_ASK); return enChoice(`___ ${enLow(A.s)} ${v.b} ${o} ${when}?`, "Did", ["Do", "Does", A.was === "was" ? "Was" : "Were"], "標準"); }
  if (t === 6) {
    const yes = Math.random() < 0.5;
    const who = enWho(S);
    return enChoice(`Did ${who.q} ${v.b} ${o} ${when}? — ${yes ? "Yes" : "No"}, ${who.a} ___.`, yes ? "did" : "didn't",
      yes ? ["do", "does", "was"] : ["don't", "doesn't", "wasn't"], "標準");
  }
  // 規則動詞・不規則動詞の過去形（read のように過去形が同じつづりの動詞は表に入れない）
  return enChoice(`${S.s} ___ ${o} ${when}.`, v.p, [v.b, v.s, v.ing], "超基本");
}

/* ---------- 解説（通信なし時）と、AI先生への単元の説明 ---------- */
const EN_LOCAL_TIPS = {
  ippan: ["・一般動詞の否定文は do not（don't）＋動詞のもとの形。", "・疑問文は Do を文の最初に。答えも do / don't を使うよ。"],
  can: ["・can のあとの動詞は、いつも もとの形（swims ではなく swim）。", "・否定は can't（cannot）、疑問文は Can を文の最初に。"],
  sansho: ["・主語が he / she / Tom など1人（1つ）なら、動詞に s をつける。", "・have → has、study → studies、watch → watches のように形が変わる動詞もあるよ。", "・否定・疑問では does を使い、動詞はもとの形にもどる。"],
  shinkou: ["・「いま〜している」は be動詞（am / is / are）＋動詞の ing 形。", "・be動詞は主語で決まる（I → am、he → is、you や複数 → are）。"],
  kako: ["・過去の文は動詞を過去形に（play → played、go → went のように形が変わる動詞もある）。", "・否定・疑問は did を使い、動詞はもとの形にもどる。", "・be動詞の過去は was（I・1人）と were（you・複数）。"],
};

/* ================= 英語（フェーズ5）：疑問詞 =================
   答えの文を見て、空らんに入る疑問詞を選ぶ。英文はすべてアプリ用のオリジナル。
   ・ng（ダミー）は1型ずつ手で決める。答えの文と合わないことが確実なものだけ。
     例：「___ bag is this? — It's Ken's.」は Which でも通ってしまうので、Which をダミーに入れない。
         「___ subject do you like? — I like math.」も Which が通るので入れない。
   ・入力で別の疑問詞でも通る型（Which bag / Which subject など）は alts に書いて正解にする。
   ・{ } の部分を入れかえて、1つの型から何問も作る。 */
const WH_FILL = {
  city: ["Osaka", "Kyoto", "Sapporo", "Nagoya", "Fukuoka", "Sendai"],
  month: ["April 5", "May 12", "July 20", "October 3", "December 24", "March 9"],
  family: ["uncle", "father", "teacher", "brother", "cousin"],
  sister: ["sister", "cousin", "friend", "teacher"],

};
const WH_DATA = [
  { q: "___ do you live? — I live in {city}.", a: "Where", ng: ["When", "What", "Who"] },
  { q: "___ is your birthday? — It's {month}.", a: "When", ng: ["Where", "Who", "How"] },

  { q: "___ many {animal} do you have? — I have {num}.", a: "How", ng: ["What", "Who", "Where"] },
  { q: "___ old are you? — I'm {age} years old.", a: "How", ng: ["What", "Who", "When"] },
  { q: "___ do you go to school? — {way}.", a: "How", ng: ["What", "Who", "Whose"] },
  { q: "___ bag is this? — It's {owner}.", a: "Whose", ng: ["Who", "Where", "When"], alts: ["Which"] },
  { q: "___ is this? — It's {thing}.", a: "What", ng: ["Who", "Where", "When"] },
  { q: "___ subject do you like? — I like {subject}.", a: "What", ng: ["Who", "Where", "How"], alts: ["Which"] },
  { q: "___ do you play tennis? — {day}.", a: "When", ng: ["Who", "What", "Whose"] },
  { q: "___ is {name}? — {name0} is {place}.", a: "Where", ng: ["Who", "When", "Whose"] },
  { q: "___ food do you like? — I like {food}.", a: "What", ng: ["Who", "Where", "How"], alts: ["Which"] },
  { q: "___ is your favorite singer? — {name} is.", a: "Who", ng: ["Where", "When", "How"] },
  { q: "___ are you? — I'm fine, thank you.", a: "How", ng: ["What", "Where", "Who"] },
];
const WH_PRON = { Ken: "He", Tom: "He", Yuki: "She", Mika: "She" };

function whFill(d) {
  const used = {};
  const q = d.q.replace(/\{(\w+)\}/g, (m, k) => {
    if (k === "name0") return WH_PRON[used.name];
    used[k] = pickOne(WH_FILL[k]);
    return used[k];
  });
  return q;
}

function genEnWh(level) {
  const pool = level >= 3 ? WH_DATA : WH_DATA.filter(d => ["Where", "When", "Who", "What"].includes(d.a) && !d.q.startsWith("___ time") && !d.q.includes("subject") && !d.q.includes("food"));
  const d = pickOne(pool);
  const q = whFill(d);
  const form = enForm(level);
  if (form === "arrange") {
    // 質問の文だけをならべかえる（— より前。最初の疑問詞は大文字の札なので並べ方は1つ）
    const ask = q.split(" — ")[0].replace("___", d.a).replace(/\?$/, "");
    return enArrange(enWords(ask));
  }
  if (form === "input") return enInput(q, d.a, d.alts); // Which でも通る型は alts で正解にする
  return enChoice(q, d.a, d.ng, level >= 3 ? "標準" : "超基本");
}

const KANJI_DATA = [
  { kanjiS: "ハンドルを握る。",           kanaS: "ハンドルをにぎる。",

/* レベルで出題形式を変える：Lv1-2=読みのみ / Lv3+=読みと書きを混ぜる */
function genKokugoProblem(level) {
  const d = KANJI_DATA[rint(0, KANJI_DATA.length - 1)];
  const kaki = level >= 3 && Math.random() < 0.5;

  // rid … 「同じ問題」とみなす目印。読みと書きで文はちがっても同じ漢字なら同じ問題として、続けて出さない。
  // mark は「問題文の中で目立たせる部分」。答えそのものではなく、答える対象のほうを指す。
  if (kaki) {
    // 書き：かな書きの例文を見せて、正しい漢字を4択で選ぶ
    return { type: "text", ui: "choice", kind: "書き", q: d.kanaS, a: d.kaki, choices: shuffle([d.kaki].concat(d.kakiNG)), mark: d.yomi, rid: d.kaki };
  }
  // 読み：漢字入りの例文を見せて、正しい読みを4択で選ぶ
  return { type: "text", ui: "choice", kind: "読み", q: d.kanjiS, a: d.yomi, choices: shuffle([d.yomi].concat(d.yomiNG)), mark: d.kaki, rid: d.kaki };
}

/* レベルで出題範囲を変える：Lv1-2=基本のみ / Lv3+=発展も混ざる */
function genRikaProblem(level) {
  const pool = level >= 3 ? RIKA_DATA : RIKA_DATA.filter(d => !d.adv);
  const d = pool[rint(0, pool.length - 1)];
  return { type: "text", ui: "choice", kind: d.adv ? "発展" : "基本", q: d.q, a: d.a, choices: shuffle([d.a].concat(d.ng)), why: d.why };
}

const DENSITY_MAT = [{ n: "アルミニウム", d: 2.7 }, { n: "鉄", d: 7.9 }, { n: "銅", d: 8.9 }, { n: "鉛", d: 11.3 }];
const r1 = (x) => Math.round(x * 10) / 10;
function genBusshitsuCalc() {
  const t = rint(1, 3);
  if (t === 1) {
    const M = pickOne(DENSITY_MAT), V = rint(2, 10), m = r1(M.d * V);
    return { type: "number", ui: "choice", kind: "計算", text: true, q: `質量${m}g、体積${V}cm³の物質の密度は何g/cm³？`, a: M.d,
      choices: choices4(M.d, [r1(V / m), r1(M.d + 1), r1(M.d * 2), r1(M.d - 1)].filter(x => x > 0)), v: { t: "density", m, V },
      why: "密度＝質量÷体積。" };
  }
  if (t === 2) {
    const M = pickOne(DENSITY_MAT), V = rint(2, 10), m = r1(M.d * V);
    return { type: "number", ui: "choice", kind: "計算", text: true, q: `${M.n}（密度${M.d}g/cm³）${V}cm³の質量は何g？`, a: m,
      choices: choices4(m, [r1(M.d + V), r1(m + M.d), r1(V / M.d), r1(m * 2)].filter(x => x > 0)), v: { t: "mass", d: M.d, V },
      why: "質量＝密度×体積。" };
  }
  const total = pickOne([50, 100, 200, 250]), pct = pickOne([4, 5, 10, 20, 25]), s = total * pct / 100, w = total - s;
  return { type: "number", ui: "choice", kind: "計算", text: true, q: `水${w}gに食塩${s}gをとかした。質量パーセント濃度は何%？`, a: pct,
    choices: choices4(pct, [r1(s / w * 100), pct * 2, pct + 5, Math.max(1, pct - 2)]), v: { t: "conc", s, w },
    why: "濃度(%)＝溶質÷（溶質＋溶媒）×100。水の質量だけで割らないこと。" };
}
function genBusshitsuProblem(level) {
  if (level >= 3 && Math.random() < 0.25) return genBusshitsuCalc();
  return genTableProblem(BUSSHITSU_DATA, level);
}

function genHikariCalc() {
  const t = rint(1, 4);
  if (t === 1) {
    const sec = rint(2, 9), dist = 340 * sec;
    return { type: "number", ui: "choice", kind: "計算", text: true, q: `雷の光が見えてから${sec}秒後に音が聞こえた。雷までの距離は何m？（音の速さ340m/s）`, a: dist,
      choices: choices4(dist, [dist / 2, 340 + sec, dist + 340, dist - 340]), v: { t: "sound", s: 340, sec },
      why: "距離＝速さ×時間。" };
  }
  if (t === 2) {
    const sec = pickOne([2, 4, 6, 8, 10]), dist = 340 * sec / 2;
    return { type: "number", ui: "choice", kind: "計算", text: true, q: `山に向かってさけぶと、${sec}秒後にやまびこが聞こえた。山までの距離は何m？（音の速さ340m/s）`, a: dist,
      choices: choices4(dist, [dist * 2, dist + 340, dist - 170, 340 * sec + 340]), v: { t: "echo", s: 340, sec },
      why: "やまびこは山まで行って帰ってくる。往復の距離÷2。" };
  }
  if (t === 3) {
    const per = pickOne([2, 3, 4, 5]), F = rint(2, 6), x = per * F;
    return { type: "number", ui: "choice", kind: "計算", text: true, q: `1Nの力で${per}cmのびるばねを、${F}Nの力で引くと何cmのびる？`, a: x,
      choices: choices4(x, [per + F, x + per, x - per, F]), v: { t: "spring", per, F },
      why: "フックの法則：のびは力に比例。1Nで" + per + "cmなら、" + F + "Nでその" + F + "倍。" };
  }
  const g = pickOne([200, 300, 500, 600, 800, 1200]), N = g / 100;
  return { type: "number", ui: "choice", kind: "計算", text: true, q: `質量${g}gの物体にはたらく重力は約何N？（100gの物体にはたらく重力を1Nとする）`, a: N,
    choices: choices4(N, [g / 10, g, N * 2, N + 1]), v: { t: "weight", g },
    why: "100gで1Nなので、gを100で割る。" };
}

/* レベルで出題範囲を変える：Lv1-2=基本のみ / Lv3+=発展も混ざる */
function genShakaiProblem(level) {
  const pool = level >= 3 ? SHAKAI_DATA : SHAKAI_DATA.filter(d => !d.adv);
  const d = pool[rint(0, pool.length - 1)];
  return { type: "text", ui: "choice", kind: d.adv ? "発展" : "基本", q: d.q, a: d.a, choices: shuffle([d.a].concat(d.ng)), why: d.why };
}

/* 時差の計算：都市の経度（東経はプラス、西経はマイナス） */
const JISA_CITIES = [
  { n: "ロンドン", lon: 0 }, { n: "ニューヨーク", lon: -75 }, { n: "ロサンゼルス", lon: -120 },
  { n: "カイロ", lon: 30 }, { n: "ニューデリー", lon: 75 }, { n: "シドニー", lon: 150 }, { n: "ペキン", lon: 120 },
];
const hourStr = (h) => `${((h % 24) + 24) % 24}時`;
function genJisa() {
  const c = pickOne(JISA_CITIES), jp = rint(0, 23);
  const diff = (135 - c.lon) / 15, h = jp - diff;
  const ans = hourStr(h);
  const choices = choices4(ans, [hourStr(jp + diff), hourStr(h + 1), hourStr(h - 1), hourStr(h + 12)]);
  return { type: "text", ui: "choice", kind: "時差", text: true,
    q: `日本が${jp}時のとき、${c.n}（標準時子午線は${c.lon === 0 ? "経度0度" : c.lon > 0 ? `東経${c.lon}度` : `西経${-c.lon}度`}）は何時？（サマータイムは考えない）`,
    a: ans, choices, v: { t: "jisa", jp, lon: c.lon }, why: `経度の差は${Math.abs(135 - c.lon)}度。15度で1時間なので時差は${Math.abs(diff)}時間。日本より西（東経が小さい）なら時刻はおそい。` };
}
function genNihonProblem(level) {
  if (level >= 3 && Math.random() < 0.2) return genJisa();
  return genTableProblem(NIHON_DATA, level);
}

/* ----- 文字式 v1：式の値（代入）。答えはすべて整数 ----- */
/* 超基本：x に数を代入して値を求める問題を無限生成（1次・係数は正） */
function genKihon_moji(level) {
  const vars = ["x", "a", "y"];
  const vname = vars[rint(0, vars.length - 1)];
  const k = rint(1, Math.min(3 + level, 6)); // 係数（正）
  const b = rint(-9, 9);                       // 定数
  const v = rint(-6, 6);                        // 代入する値
  const coef = (k === 1) ? vname : `${k}${vname}`;
  const cons = (b === 0) ? "" : (b > 0 ? ` + ${b}` : ` - ${-b}`);
  return { q: `${vname} = ${v} のとき　${coef}${cons} の値`, a: k * v + b, kind: "超基本" };
}

/* 文字式の標準：型＋ランダムな数（フェーズ4）。4回に1回は固定の MOJI からも出す。答えはすべて整数。 */
function genStd_moji(level) {
  if (Math.random() < 0.25) return genFromPool(MOJI);
  const t = rint(1, 4);
  const v = pickOne(["x", "a", "y"]);
  const val = nz(-5, 5);
  if (t === 1) {        // 負の係数をふくむ1次式
    const k = nz(-6, 6), b = rint(-9, 9);
    return { q: `${v} = ${val} のとき　${term(k, v, true)}${cst(b)} の値`, a: k * val + b, kind: "標準" };
  }
  if (t === 2) {        // 定数が先：6 - 2x
    const b = rint(1, 12), k = rint(1, 5);
    return { q: `${v} = ${val} のとき　${b}${term(-k, v, false)} の値`, a: b - k * val, kind: "標準" };
  }
  if (t === 3) {        // 2乗をふくむ式
    const k = pickOne([1, 2, 3, -1, -2]), b = rint(-6, 6), w = rint(-4, 4) || 2;
    return { q: `${v} = ${w} のとき　${term(k, v + "²", true)}${cst(b)} の値`, a: k * w * w + b, kind: "標準" };
  }
  // 2つの文字
  const [p, r] = pickOne([["x", "y"], ["a", "b"]]);
  const pv = nz(-5, 5), rv = nz(-5, 5), k1 = nz(-4, 4), k2 = nz(-4, 4);
  return { q: `${p} = ${pv}, ${r} = ${rv} のとき　${term(k1, p, true)}${term(k2, r, false)} の値`, a: k1 * pv + k2 * rv, kind: "標準" };
}

/* ================= 数学：データの活用（フェーズ5）=================
   ・超基本（Lv1-2）：平均値・中央値（個数が奇数）・最頻値・範囲
   ・標準（Lv3〜）：中央値（個数が偶数）、相対度数、階級値、ヒストグラム（図つき）の読み取り、
                   相対度数で表す確率（多数回の試行）、用語
   ・答えが整数にならない相対度数・確率は、4択を問題側で作る（小数 2 けたまで）。
   ・v（検算用の材料）を持たせ、tools/verify.mjs が計算し直して確かめる。 */
const DATA_TERMS = [
  { q: "データを大きさの順に並べたとき、まん中にくる値は？", a: "中央値", ng: ["平均値", "最頻値", "範囲"] },

  { q: "データを整理するために区切った、それぞれの区間を何という？", a: "階級", ng: ["度数", "範囲", "階級値"] },
  { q: "それぞれの階級に入るデータの個数を何という？", a: "度数", ng: ["階級", "相対度数", "累積度数"] },
  { q: "階級のまん中の値を何という？", a: "階級値", ng: ["中央値", "平均値", "度数"] },
  { q: "度数の分布を、柱を並べたグラフで表したものは？", a: "ヒストグラム", ng: ["折れ線グラフ", "円グラフ", "帯グラフ"] },
  { q: "ある階級の度数の、全体の度数に対する割合を何という？", a: "相対度数", ng: ["累積度数", "度数", "階級値"] },
  { q: "最初の階級から、ある階級までの度数を合計したものは？", a: "累積度数", ng: ["相対度数", "度数", "範囲"] },
  { q: "あることがらの起こりやすさの程度を表す数を何という？", a: "確率", ng: ["度数", "範囲", "平均値"] },
];
const r2 = (x) => Math.round(x * 100) / 100;

function dataList(n, lo, hi) { const a = []; for (let i = 0; i < n; i++) a.push(rint(lo, hi)); return a; }
const listStr = (a) => a.join("、");

function genKihon_data(level) {
  const t = rint(1, 4);
  if (t === 1) { // 平均値（割り切れるように最後の1つで調整）
    const n = pickOne([4, 5]), m = rint(4, 8);
    let vals;
    for (;;) { vals = dataList(n - 1, 1, 10); const last = n * m - vals.reduce((s, x) => s + x, 0); if (last >= 1 && last <= 10) { vals.push(last); break; } }
    vals = shuffle(vals);
    return { q: `${n}人のテストの点数「${listStr(vals)}」の平均値は？`, a: m, kind: "超基本", text: true, v: { t: "mean", vals } };
  }
  if (t === 2) { // 中央値（奇数個）
    const vals = dataList(pickOne([5, 7]), 1, 20);
    const med = vals.slice().sort((x, y) => x - y)[(vals.length - 1) / 2];
    return { q: `データ「${listStr(vals)}」の中央値は？`, a: med, kind: "超基本", text: true, v: { t: "median", vals } };
  }
  if (t === 3) { // 最頻値（1つの値だけ3回）
    const m = rint(2, 15);
    const others = shuffle([...Array(20).keys()].map(i => i + 1).filter(x => x !== m)).slice(0, 4);
    const vals = shuffle([m, m, m, others[0], others[1], others[2], others[2] === others[3] ? others[0] : others[3]]);
    return { q: `データ「${listStr(vals)}」の最頻値は？`, a: m, kind: "超基本", text: true, v: { t: "mode", vals } };
  }
  const vals = dataList(6, 1, 30); // 範囲
  return { q: `データ「${listStr(vals)}」の範囲は？`, a: Math.max(...vals) - Math.min(...vals), kind: "超基本", text: true, v: { t: "range", vals } };
}

function genStd_data(level) {
  const t = rint(1, 7);
  if (t === 1) { // 中央値（偶数個・整数になるように）
    for (;;) {
      const vals = dataList(6, 1, 20); const s = vals.slice().sort((x, y) => x - y);
      if ((s[2] + s[3]) % 2 === 0) return { q: `データ「${listStr(vals)}」の中央値は？`, a: (s[2] + s[3]) / 2, kind: "標準", text: true, v: { t: "median", vals } };
    }
  }
  if (t === 2) { // 相対度数
    const total = pickOne([20, 25, 50]), c = rint(1, total - 1), a = r2(c / total);
    const ch = choices4(a, [r2(a + 0.1), r2(Math.max(0.01, a - 0.05)), r2(c / 100), r2(a + 0.2)].filter(x => x > 0 && x < 1));
    return { q: `全体が${total}人で、ある階級の度数が${c}人。この階級の相対度数は？`, a, choices: ch, ui: "choice", kind: "標準", text: true, v: { t: "rel", c, total } };
  }
  if (t === 3) { // 階級値
    const w = pickOne([5, 10, 20]), lo = w * rint(0, 8);

  }
  const d = pickOne(DATA_TERMS);

/* ================= 数学：比例と反比例（フェーズ5）=================

   ・反比例の比例定数は 6・8・12・18・24 など約数の多い数にして、y が整数になる x だけを使う。 */
const HIREI_TERMS = [
  { q: "y = ax の a を何という？", a: "比例定数", ng: ["変数", "座標", "原点"], why: "y = ax（反比例は y = a/x）の a を比例定数というよ。" },

  { q: "反比例で、x の値が2倍になると y の値は？", a: "1/2倍", ng: ["2倍", "4倍", "変わらない"], why: "反比例は xy = a で一定。x が2倍なら y は1/2倍。" },
  { q: "比例で、x の値が3倍になると y の値は？", a: "3倍", ng: ["1/3倍", "9倍", "変わらない"], why: "比例は y = ax。x が3倍なら y も3倍。" },
  { q: "点(3, -2)の x 座標は？", a: "3", ng: ["-2", "1", "5"], why: "(x座標, y座標)の順に書くよ。前が x 座標。", type: "text" },

const HANPI_A = [6, 8, 12, 18, 24];
const divisors = (n) => { const out = []; for (let i = 1; i <= n; i++) if (n % i === 0) out.push(i); return out; };
const lineStr = (a) => a === 1 ? "y=x" : a === -1 ? "y=-x" : `y=${a}x`;
const hyperStr = (a) => `y=${a}/x`;

function hireiTerm() {
  const d = pickOne(HIREI_TERMS);
  return { q: d.q, a: d.a, type: "text", ui: "choice", choices: shuffle([d.a].concat(d.ng)), kind: "用語", why: d.why, text: true };
}

function genKihon_hirei(level) {

  }

  }
  if (t === 3) { // 反比例の比例定数
    const a = pickOne(HANPI_A) * pickOne([1, -1]), x = pickOne(divisors(Math.abs(a))) * pickOne([1, -1]);
    return { q: `y は x に反比例し、x = ${x} のとき y = ${a / x}。比例定数は？`, a, kind: "超基本", text: true, v: { t: "hanpi_a", x, y: a / x } };
  }

  return { q: `y = ${a}/x で、x = ${x} のときの y は？`, a: a / x, kind: "超基本", text: true, v: { t: "hanpi_y", a, x } };
}

function genStd_hirei(level) {

    return { q: `y は x に比例し、x = ${x1} のとき y = ${a * x1}。x = ${x2} のときの y は？`, a: a * x2, kind: "標準", text: true, v: { t: "hirei_y2", x1, y1: a * x1, x2 } };
  }
  if (t === 2) { // 反比例：別の x のときの y
    const a = pickOne(HANPI_A) * pickOne([1, -1]);
    const ds = divisors(Math.abs(a));
    const x1 = pickOne(ds); let x2 = pickOne(ds) * pickOne([1, -1]); if (x2 === x1) x2 = -x1;
    return { q: `y は x に反比例し、x = ${x1} のとき y = ${a / x1}。x = ${x2} のときの y は？`, a: a / x2, kind: "標準", text: true, v: { t: "hanpi_y2", x1, y1: a / x1, x2 } };
  }

    const x = pickOne(divisors(Math.abs(a)).filter(d => d >= 2 && Math.abs(a / d) <= 6));
    const ans = hyperStr(a);
    const cands = [hyperStr(-a), lineStr(a / x > 0 ? 2 : -2), hyperStr(a / 2)];
    return { q: "このグラフの式はどれ？", a: ans, type: "text", ui: "choice", choices: choices4(ans, cands), kind: "標準",

  }
  return hireiTerm();
}

/* ----- 方程式 v1：1次方程式。答え（解 x）はすべて整数 ----- */
/* 超基本：ax + b = c の形を無限生成（解は整数）。「…を解くと、x」の後にUIが「=」を付ける */
function genKihon_houtei(level) {
  const sol = rint(-6, 6);                         // 解 x（答え）
  const co = rint(2, Math.min(2 + level, 5));      // 係数（2以上）
  const bb = rint(-9, 9);                           // 定数
  const c = co * sol + bb;                          // 右辺
  const bCons = (bb === 0) ? "" : (bb > 0 ? ` + ${bb}` : ` - ${-bb}`);
  return { q: `${co}x${bCons} = ${c} を解くと、x`, a: sol, kind: "超基本" };
}

/* 方程式の標準：型＋ランダムな数（フェーズ4）。4回に1回は固定の HOUTEI からも出す。
   解（答え）を先に決めてから式を作るので、解はいつも整数。tools/verify.mjs が代入して検算する。 */
function genStd_houtei(level) {
  if (Math.random() < 0.25) return genFromPool(HOUTEI);
  const sol = rint(-6, 6);
  const t = rint(1, 3);
  if (t === 1) {        // 両辺に x：ax + b = cx + d
    const a = rint(2, 7);
    let c = nz(-3, 5); if (c === a) c = a - 1 || -1;
    const b = rint(-9, 9), d = a * sol + b - c * sol;
    return { q: `${term(a, "x", true)}${cst(b)} = ${term(c, "x", true)}${cst(d)} を解くと、x`, a: sol, kind: "標準" };
  }
  if (t === 2) {        // かっこ：k(x + m) = n
    const k = rint(2, 5), m = nz(-6, 6), n = k * (sol + m);
    return { q: `${k}(x${cst(m)}) = ${n} を解くと、x`, a: sol, kind: "標準" };
  }
  // 定数から x をひく：n - kx = c
  const n = rint(3, 15), k = rint(1, 4), c = n - k * sol;
  return { q: `${n}${term(-k, "x", false)} = ${c} を解くと、x`, a: sol, kind: "標準" };
}

function kukanTerm() {

/* π をふくむ答えの4択。まちがえやすい値（alts）が重なって足りないときは、近い数で埋める */
const piChoices = (k, alts) => choices4(piStr(k), alts.concat([k * 2, k + 1, k + 2, k * 3, k + 4])
  .filter(x => Number.isInteger(x) && x > 0 && x !== k).map(piStr));

      fig: { type: "solid", kind: "cylinder", labels: { r: `${r}cm`, h: `${h}cm` } }, v: { t: "vol_cyl", r, h } };

    return { q: "この円錐の体積は何cm³？", a: piStr(k), type: "text", ui: "choice", choices: piChoices(k, [r * r * h, k * 2, r * h, k + 3]), kind: "標準", text: true,

    return { q: `底面が1辺${a}cmの正方形、高さ${h}cmの正四角錐の体積は何cm³？`, a: a * a * h / 3, kind: "標準", text: true,

    return { q: `半径${r}cmの球の体積は何cm³？`, a: piStr(k), type: "text", ui: "choice", choices: piChoices(k, [4 * r * r, r * r * r, k * 2, 4 * r * r * r]), kind: "標準", text: true,

  }
  return kukanTerm();
}

/* セーブの引き継ぎ：セーブはFirebaseの users/{端末ID} にあり、端末IDはこの端末のlocalStorageにだけある。
   ホーム画面のアイコンを消すと端末IDが消えて新規扱いになるため、番号の確認と切り替えをここでできるようにする。
   iOSのホーム画面アプリでは window.confirm が効かないことがあるので、2回タップで確定する。 */
function DeviceTransfer() {
  const cur = getDeviceId();
  const [v, setV] = useState("");
  const [msg, setMsg] = useState("");
  const [armed, setArmed] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(cur); setMsg("今の番号をコピーしました。メモ帳などに保存しておいてください"); }
    catch (e) { setMsg("コピーできませんでした。番号を長押しして選んでください"); }
  };
  const apply = () => {
    const id = v.trim();
    if (!/^dev-[0-9a-z-]{8,}$/i.test(id)) { setMsg("番号の形がちがいます。dev- で始まる番号をそのまま貼り付けてください"); setArmed(false); return; }
    if (id === cur) { setMsg("今と同じ番号です"); setArmed(false); return; }
    if (!armed) { setArmed(true); setMsg("もう一度押すと切り替えて再起動します（今のセーブは使われなくなります）"); setTimeout(() => setArmed(false), 5000); return; }
    try { localStorage.setItem("rino_device_id", id); localStorage.setItem("rino_force_migrate", "1"); }
    catch (e) { setMsg("保存できませんでした"); return; }
    location.reload();
  };
  const box = { background: "#1b1828", border: "1px solid #34304a", borderRadius: 12, padding: 12, marginBottom: 14 };
  const btn = { border: "none", borderRadius: 8, padding: "7px 12px", fontWeight: 800, cursor: "pointer", fontSize: 12 };
  return (
    <div style={box}>
      <div style={{ fontWeight: 800, color: "#ffd56b", fontSize: 13, marginBottom: 6 }}>セーブの引き継ぎ</div>
      <div style={{ fontSize: 11, color: "#8a83a8", marginBottom: 4 }}>この端末の番号（控えておけばアイコンを消しても戻せます）</div>
      <div style={{ fontSize: 11, color: "#cfc7e6", wordBreak: "break-all", userSelect: "all", WebkitUserSelect: "all", marginBottom: 6 }}>{cur}</div>
      <button onClick={copy} style={{ ...btn, background: "#2a2740", color: "#cfc7e6", marginBottom: 10 }}>番号をコピー</button>
      <div style={{ fontSize: 11, color: "#8a83a8", marginBottom: 4 }}>前の番号に切り替える</div>
      <input value={v} onChange={e => { setV(e.target.value); setArmed(false); }} placeholder="dev-xxxxxxxx-xxxx-..."
        autoCapitalize="off" autoCorrect="off" spellCheck={false}
        style={{ width: "100%", boxSizing: "border-box", background: "#0e0c16", color: "#cfc7e6", border: "1px solid #34304a",
          borderRadius: 8, padding: "8px 10px", fontSize: 16, marginBottom: 8, fontFamily: "inherit" }} />
      <button onClick={apply} style={{ ...btn, background: armed ? "#e8a33a" : "#8be9c0", color: "#12101c" }}>
        {armed ? "もう一度押して確定" : "この番号に切り替える"}
      </button>
      {msg && <div style={{ fontSize: 11, color: "#ffd56b", marginTop: 8, lineHeight: 1.5 }}>{msg}</div>}
    </div>
  );
}

/* アカウント（親用）：匿名セーブにメール＋パスワードを登録しておくと、アイコンを消しても・別のiPhoneでも同じセーブに戻れる。
   ⚠ いまはdevパネルの中にある。DEV_PANEL_ENABLED を false にする前に、親が使える場所へ移すこと */
function AccountBox() {
  const [, force] = useState(0);
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [armed, setArmed] = useState(false);
  const linked = fb.uid && !fb.isAnonymous;
  const status = !fb.uid ? "ログインしていません（Firebaseの設定待ち。今は端末IDで保存中）"
    : linked ? "登録済み：" + fb.email : "匿名でログイン中（メール未登録）";
  const check = () => {
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())) { setMsg("メールアドレスの形がちがいます"); return false; }
    if (pw.length < 6) { setMsg("パスワードは6文字以上にしてください"); return false; }
    return true;
  };
  const doRegister = async () => {
    if (!check()) return;
    setBusy(true); setMsg("");
    try { await registerEmail(email, pw); setPw(""); setMsg("登録しました。このメールとパスワードを忘れないように控えてください"); force(n => n + 1); }
    catch (e) { setMsg(authErrorText(e)); }
    setBusy(false);
  };
  const doLogin = async () => {
    if (!check()) return;
    if (!armed) { setArmed(true); setMsg("もう一度押すとログインして再起動します（いまのセーブからそのメールのセーブに切り替わります）"); setTimeout(() => setArmed(false), 5000); return; }
    setBusy(true); setMsg("");
    try { await loginEmail(email, pw); location.reload(); }
    catch (e) { setMsg(authErrorText(e)); setArmed(false); setBusy(false); }
  };
  const box = { background: "#1b1828", border: "1px solid #34304a", borderRadius: 12, padding: 12, marginBottom: 14 };
  const btn = { border: "none", borderRadius: 8, padding: "7px 12px", fontWeight: 800, cursor: "pointer", fontSize: 12, marginRight: 8, marginBottom: 6 };
  const inp = { width: "100%", boxSizing: "border-box", background: "#0e0c16", color: "#cfc7e6", border: "1px solid #34304a",
    borderRadius: 8, padding: "8px 10px", fontSize: 16, marginBottom: 8, fontFamily: "inherit" };
  return (
    <div style={box}>
      <div style={{ fontWeight: 800, color: "#ffd56b", fontSize: 13, marginBottom: 6 }}>アカウント（親用）</div>
      <div style={{ fontSize: 11, color: linked ? "#9fe8c6" : "#cfc7e6", marginBottom: 8, lineHeight: 1.5 }}>{status}</div>
      <div style={{ fontSize: 11, color: "#8a83a8", marginBottom: 8, lineHeight: 1.5 }}>
        メールとパスワードを登録しておくと、アイコンを消しても・別のiPhoneでも「ログイン」で同じセーブに戻れます。
      </div>
      <input type="email" value={email} onChange={e => { setEmail(e.target.value); setArmed(false); }} placeholder="メールアドレス"
        autoCapitalize="off" autoCorrect="off" spellCheck={false} style={inp} />
      <input type="password" value={pw} onChange={e => { setPw(e.target.value); setArmed(false); }} placeholder="パスワード（6文字以上）" style={inp} />
      {fb.uid && !linked && (
        <button disabled={busy} onClick={doRegister} style={{ ...btn, background: "#8be9c0", color: "#12101c" }}>このセーブに登録</button>
      )}
      <button disabled={busy} onClick={doLogin} style={{ ...btn, background: armed ? "#e8a33a" : "#2a2740", color: armed ? "#12101c" : "#cfc7e6" }}>
        {armed ? "もう一度押して確定" : "登録済みのメールでログイン"}
      </button>
      {msg && <div style={{ fontSize: 11, color: "#ffd56b", marginTop: 4, lineHeight: 1.5 }}>{msg}</div>}
    </div>
  );
}

  const doneAll = allItems.filter(i => i.done).length;
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 50, background: "rgba(8,5,20,.82)",
      display: "flex", alignItems: "center", justifyContent: "center", boxSizing: "border-box",
      padding: "calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px)" }}>
      <div onClick={e => e.stopPropagation()} style={{ width: "100%", maxWidth: 440, maxHeight: "100%", overflowY: "auto", boxSizing: "border-box",
        background: "#12101c", borderRadius: 18, border: "1px solid #34304a", padding: 16,
        fontFamily: "ui-monospace,Menlo,Consolas,monospace", color: "#cfc7e6" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <span style={{ fontWeight: 800, color: "#8be9c0", fontSize: 14 }}>DEV / 進捗チェックリスト</span>
          <button onClick={onClose} style={{ background: "#2a2740", color: "#cfc7e6", border: "none", borderRadius: 8,
            padding: "5px 12px", fontWeight: 800, cursor: "pointer", fontSize: 13 }}>閉じる ✕</button>
        </div>
        <div style={{ fontSize: 12, color: "#8a83a8", marginBottom: 12 }}>全体 {doneAll}/{allItems.length} 完了</div>
        <AccountBox />
        <DeviceTransfer />
        {PROGRESS.map((p, pi) => {
          const d = p.items.filter(i => i.done).length;
          return (
            <div key={pi} style={{ marginBottom: 14 }}>
              <div style={{ fontWeight: 800, color: "#ffd56b", fontSize: 13, marginBottom: 6, borderBottom: "1px solid #2a2740", paddingBottom: 4 }}>
                {p.phase}　<span style={{ color: "#6f6a88", fontWeight: 600 }}>({d}/{p.items.length})</span>
              </div>
              {p.items.map((it, ii) => (
                <div key={ii} style={{ display: "flex", gap: 8, fontSize: 13, lineHeight: 1.9,
                  color: it.done ? "#9fe8c6" : "#9b95b4" }}>
                  <span>{it.done ? "✅" : "⬜"}</span><span>{it.t}</span>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ================= メインアプリ ================= */
function Rinogical() {
  const [screen, setScreen] = useState("loading");
  const [tip] = useState(() => { const a = t("tips"); return a[rint(0, a.length - 1)]; });
  const [character, setCharacter] = useState(null);
  const [nickname, setNickname] = useState("");
  // coins は全科目共通。level/xp は科目ごと（数学・英語…）に分けて持つ
  const [player, setPlayer] = useState({ coins: 0, subjects: { math: { level: 1, xp: 0 }, english: { level: 1, xp: 0 }, kokugo: { level: 1, xp: 0 }, rika: { level: 1, xp: 0 }, shakai: { level: 1, xp: 0 } } });
  const [subject, setSubject] = useState("math"); // いまプレイ中の科目
  const [unit, setUnit] = useState("seifu");       // いまの単元（数学：正負の数 / 文字式 … 国語：漢字 …）
  const [battleReturn, setBattleReturn] = useState("trials"); // バトル後の戻り先
  const prog = (player.subjects && player.subjects[subject]) || { level: 1, xp: 0 };
  const deviceIdRef = useRef(null);
  const persistReady = useRef(false); // 初回読込が終わるまで保存しない（既存データの上書き防止）

  // 背景画像：読み込めたときだけ切り替える（無ければ今までのグラデーションのまま）
  const [bgUrl, setBgUrl] = useState(null);
  useEffect(() => {
    const url = assetUrl(ASSETS.backgrounds && ASSETS.backgrounds.adventure);
    if (!url) return;
    const im = new Image();
    im.onload = () => setBgUrl(url);
    im.src = url;
  }, []);

  /* 起動時：Firebase初期化 → デバイスID取得 → データ読込（無ければ初期設定へ） */
  useEffect(() => {
    let alive = true;
    (async () => {
      const sleep = new Promise(r => setTimeout(r, 1300)); // ローディング演出の最低表示時間
      await initFirebase();
      const { key, data } = await loadSaveData(); // ログインできればuid、できなければ端末IDに保存
      deviceIdRef.current = key;
      await sleep;
      if (!alive) return;
      if (data && data.nickname) {
        const ch = CHARACTERS.find(c => c.id === data.characterId)
          || { id: data.characterId || "myao", accent: data.characterAccent || C.lav };
        setNickname(data.nickname);
        setCharacter(ch);
        // 旧データ（level/xp が直接入っている）→ subjects.math へ自動で引っ越し
        let subjects;
        if (data.subjects && typeof data.subjects === "object") {
          subjects = {
            math: data.subjects.math || { level: 1, xp: 0 },
            english: data.subjects.english || { level: 1, xp: 0 },
            kokugo: data.subjects.kokugo || { level: 1, xp: 0 },
            rika: data.subjects.rika || { level: 1, xp: 0 },
            shakai: data.subjects.shakai || { level: 1, xp: 0 },
          };
        } else {
          subjects = {
            math: { level: data.level ?? 1, xp: data.xp ?? 0 },
            english: { level: 1, xp: 0 },
            kokugo: { level: 1, xp: 0 },
            rika: { level: 1, xp: 0 },
            shakai: { level: 1, xp: 0 },
          };
        }
        setPlayer({ coins: data.coins ?? 0, subjects });
        setScreen("home"); // 続きから
      } else {
        setScreen("character"); // 新規：初期設定へ
      }
      persistReady.current = true; // ここから保存を有効化
    })();
    return () => { alive = false; };
  }, []);

  /* 保存タイミング：レベルアップ・コイン増加・XP変化（=playerの変化）／ニックネーム・キャラ確定時 */
  useEffect(() => {
    if (!persistReady.current) return;
    if (!nickname || !character) return;
    const ch = character || {};
    saveUserData(deviceIdRef.current, {
      nickname,
      characterId: ch.id || null,
      characterAccent: ch.accent || null,
      coins: player.coins,
      subjects: player.subjects,
      // 互換用（古い形式しか見ない処理があっても困らないように、数学の値を残す）
      level: (player.subjects.math || {}).level ?? 1,
      xp: (player.subjects.math || {}).xp ?? 0,
    });
  }, [player, nickname, character]);

  const font = { fontFamily: "'Hiragino Maru Gothic ProN','Yu Gothic UI','M PLUS Rounded 1c',system-ui,sans-serif" };
  const baseGrad = `radial-gradient(1200px 500px at 50% -10%, ${C.bg2}, ${C.bg0} 70%)`;
  // 背景画像が読めた時だけ：上に薄暗いベールを重ねて文字を読みやすくする
  const bgStyle = bgUrl

    <div style={{ ...font, minHeight: "100vh", boxSizing: "border-box", color: C.ink, position: "relative", overflow: "hidden",

      // iPhoneのホーム画面アプリは時計・電波表示の下まで広がるので、その分（safe-area）を上下に足す
      padding: "calc(env(safe-area-inset-top, 0px) + 26px) 18px calc(env(safe-area-inset-bottom, 0px) + 26px)",

      <Keyframes />
      {/* 背景のルーン */}
      {["✦", "✧", "⚝", "❉", "✺", "✦"].map((r, i) => (
        <span key={i} style={{ position: "absolute", color: C.aqua, fontSize: 16 + (i % 3) * 8,
          left: `${(i * 17 + 5) % 92}%`, top: `${(i * 23 + 8) % 88}%`, animation: `rino-rune ${4 + i}s ease-in-out infinite`, pointerEvents: "none" }}>{r}</span>
      ))}

      <div style={{ maxWidth: 460, margin: "0 auto", position: "relative" }}>
        {screen === "loading" && <Loading tip={tip} />}
        {screen === "character" && <CharacterSelect onPick={(c) => { setCharacter(c); setScreen("name"); }} />}
        {screen === "name" && (
          <NameInput accent={character?.accent} imgSrc={assetUrl(character?.img)}
            nickname={nickname} setNickname={setNickname}
            onNext={() => setScreen("tutorial")} />
        )}
        {screen === "tutorial" && <Tutorial char={character} nickname={nickname} onStart={() => setScreen("home")} />}
        {screen === "home" && <SubjectHome char={character} coins={player.coins} nickname={nickname}
          onMath={() => { setSubject("math"); setScreen("trials"); }}
          onEnglish={() => { setSubject("english"); setScreen("trials"); }}
          onKokugo={() => { setSubject("kokugo"); setScreen("trials"); }}
          onRika={() => { setSubject("rika"); setScreen("trials"); }}
          onShakai={() => { setSubject("shakai"); setScreen("trials"); }} />}
        {screen === "trials" && <Home char={character} level={prog.level} coins={player.coins} nickname={nickname} subjectKey={subject}
          onBoss={(i) => { const R = SUBJECT_ROOMS[subject] || SUBJECT_ROOMS.math; setUnit(R.keys[i] || R.keys[0]); setBattleReturn("trials"); setScreen("battle"); }} onBack={() => setScreen("home")} />}
        {screen === "battle" && (
          <Battle char={character} player={player} setPlayer={setPlayer} subjectKey={subject} unitKey={unit} prog={prog} nickname={nickname}
            onWin={() => setScreen("victory")} onHome={() => setScreen(battleReturn)} />
        )}
        {screen === "victory" && <Victory char={character} level={prog.level} coins={player.coins} nickname={nickname} onHome={() => setScreen(battleReturn)} />}
      </div>
    </div>
  );
}
