/* ===========================================================================
   Firebase 連携（設定はここ1か所にまとめる。後から実プロジェクトの値に差し替え）
   - Artifactサンドボックスや未設定時は自動でローカル動作（保存しない）にフォールバック
   - エラーはconsoleに出すだけで、アプリは止めない
   =========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD7uAY50Bef2575lxjzuV5IBdahgzrhV7c",
  authDomain: "rinogical.firebaseapp.com",
  projectId: "rinogical",
  storageBucket: "rinogical.firebasestorage.app",
  messagingSenderId: "510843207944",
  appId: "1:510843207944:web:91a3b0095bd69203e3ecbd",
};

const FIREBASE_VER = "11.0.2"; // CDNから読むSDKのバージョン

/* 実行時に解決される firestore 関数の入れ物 */
const fb = { ready: false, db: null, doc: null, getDoc: null, setDoc: null, serverTimestamp: null,
  auth: null, authMod: null, uid: null, isAnonymous: true, email: null };
let _memDeviceId = null; // localStorageが使えない環境用の一時ID

/* 設定がプレースホルダーのままかどうか */
function firebaseConfigured() {
  return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("YOUR_");
}

/* デバイスごとのユニークID。localStorageに保存。使えなければメモリに退避 */
function getDeviceId() {
  const KEY = "rino_device_id";
  const make = () => {
    try { if (crypto?.randomUUID) return "dev-" + crypto.randomUUID(); } catch (e) {}
    return "dev-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  };
  try {
    let id = localStorage.getItem(KEY);
    if (!id) { id = make(); localStorage.setItem(KEY, id); }
    return id;
  } catch (e) {
    console.warn("[Rinogical] localStorage不可。一時IDで動作します:", e && e.message);
    if (!_memDeviceId) _memDeviceId = make();
    return _memDeviceId;
  }
}

/* Firebase初期化（CDNから動的import）。失敗時はローカル動作 */
async function initFirebase() {
  if (!firebaseConfigured()) {
    console.info("[Rinogical] Firebase未設定 → ローカル動作モード（保存なし）");
    return false;
  }
  try {
    const appMod = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-app.js`);
    const fsMod = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-firestore.js`);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    fb.db = fsMod.getFirestore(app);
    fb.doc = fsMod.doc; fb.getDoc = fsMod.getDoc; fb.setDoc = fsMod.setDoc; fb.serverTimestamp = fsMod.serverTimestamp;
    fb.ready = true;
    console.info("[Rinogical] Firebase接続OK");
    await initAuth(app);
    return true;
  } catch (e) {
    console.error("[Rinogical] Firebase初期化に失敗 → ローカル動作で続行:", e);
    return false;
  }
}

/* Firestoreから users/{deviceId} を読む。無ければ null */
async function loadUserData(deviceId) {
  if (!fb.ready) return null;
  try {
    const snap = await fb.getDoc(fb.doc(fb.db, "users", deviceId));
    return snap.exists() ? snap.data() : null;
  } catch (e) {
    console.error("[Rinogical] 読み込み失敗:", e);
    return null;
  }
}

/* Firestoreへ保存（merge）。updatedAtはサーバー時刻 */
async function saveUserData(deviceId, data, opt) {
  if (!fb.ready || !deviceId) return;
  try {
    await fb.setDoc(
      fb.doc(fb.db, "users", deviceId),
      { ...data, updatedAt: fb.serverTimestamp() },
      { merge: !(opt && opt.replace) }
    );
  } catch (e) {
    console.error("[Rinogical] 保存失敗:", e);
  }
}


/* ===========================================================================
   ログイン（2026-11〜）：匿名ログインで始め、あとで「メール＋パスワード」をひも付けられる（C方式）
   - セーブの置き場所は users/{ログインのuid}。ログインできないとき（Firebase側で未有効など）は
     従来どおり users/{端末ID} を使う（＝今までと同じ動き。安全に段階導入するため）
   - 初回：uid側にセーブが無く、端末ID側にあれば、uid側へ自動でコピー（端末ID側は消さない）
   =========================================================================== */
async function initAuth(app) {
  try {
    const am = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-auth.js`);
    fb.authMod = am;
    fb.auth = am.getAuth(app);
    // 前回のログイン状態の復元を待つ（ここで待たないと毎回新しい匿名ユーザーができてしまう）
    let user = await new Promise(resolve => {
      const off = am.onAuthStateChanged(fb.auth, u => { off(); resolve(u); });
    });
    if (!user) user = (await am.signInAnonymously(fb.auth)).user;
    setAuthUser(user);
    console.info("[Rinogical] ログインOK:", user.isAnonymous ? "匿名" : user.email);
  } catch (e) {
    fb.uid = null;
    console.warn("[Rinogical] ログインできないため端末IDで保存します:", e && (e.code || e.message));
  }
}

function setAuthUser(user) {
  fb.uid = user ? user.uid : null;
  fb.isAnonymous = user ? user.isAnonymous : true;
  fb.email = user ? (user.email || null) : null;
}

/* 起動時に呼ぶ：どこに保存するか（key）と、読み込んだセーブ（data）を返す */
async function loadSaveData() {
  const deviceId = getDeviceId();
  if (!fb.ready || !fb.uid) return { key: deviceId, data: await loadUserData(deviceId) };
  let force = false;
  try { force = localStorage.getItem("rino_force_migrate") === "1"; } catch (e) {}
  let data = force ? null : await loadUserData(fb.uid);
  if (!data || !data.nickname) {
    const legacy = await loadUserData(deviceId);
    if (legacy && legacy.nickname) {
      const copy = { ...legacy };
      delete copy.updatedAt;
      await saveUserData(fb.uid, { ...copy, migratedFrom: deviceId }, { replace: true });
      data = copy;
      console.info("[Rinogical] 端末IDのセーブをログイン側へ引っ越しました:", deviceId);
    } else if (force) {
      data = await loadUserData(fb.uid);
    }
  }
  try { localStorage.removeItem("rino_force_migrate"); } catch (e) {}
  return { key: fb.uid, data };
}

async function registerEmail(email, password) {
  if (!fb.auth || !fb.auth.currentUser) throw { code: "auth/admin-restricted-operation" };
  const am = fb.authMod;
  const cred = am.EmailAuthProvider.credential(email.trim(), password);
  const res = await am.linkWithCredential(fb.auth.currentUser, cred);
  setAuthUser(res.user);
  return res.user;
}
/* 登録済みのメールでログイン（別の端末・アイコンを消したあと用）。セーブが切り替わるので呼んだ側で再起動する */
async function loginEmail(email, password) {
  if (!fb.auth) throw { code: "auth/admin-restricted-operation" };
  const res = await fb.authMod.signInWithEmailAndPassword(fb.auth, email.trim(), password);
  setAuthUser(res.user);
  return res.user;
}

/* ================= Lottie再生部品（lottie-web を遅延読み込み）=================
   ・src があれば再生。読み込み失敗・ライブラリ未読込なら onFail を呼んで何も描かない
     （呼び出し側＝Heroが従来表示にフォールバックする）。
   ・lottie-web は importmap（esm.sh）で追加する必要がある（index.html側）。 */
function LottieView({ src, size = 200, loop = true, onFail }) {
  const box = useRef(null);
  useEffect(() => {
    if (!src) { if (onFail) onFail(); return; }
    var anim = null; var alive = true;
    import("lottie-web").then(function (mod) {
      if (!alive || !box.current) return;
      var lottie = mod.default || mod;
      anim = lottie.loadAnimation({
        container: box.current,
        renderer: "svg",
        loop: loop,
        autoplay: true,
        path: src,
      });
      anim.addEventListener("data_failed", function () { if (onFail) onFail(); });
    }).catch(function () { if (onFail) onFail(); });
    return function () { alive = false; if (anim) anim.destroy(); };
  }, [src, loop]);
  return <div ref={box} style={{ width: size, height: size, margin: "0 auto" }} />;
}

    "rino-float 3.2s ease-in-out infinite";
  const mouth =
    mood === "happy" ? "M78 138 Q100 168 122 138" :
    mood === "sad" ? "M80 150 Q100 134 120 150" :
    "M84 142 Q100 156 116 142";
  // ① Lottieがあればそれを再生（mood別→idle→画像→SVG の順にフォールバック）
  const lottiePick = lottieSet ? (lottieSet[mood] || lottieSet.idle || null) : null;
  if (lottiePick && !lottieErr) {
    return (
      <div style={{ width: size, height: size, position: "relative" }}>
        {mood === "happy" && [0, 1, 2, 3].map(i => (
          <Sparkles key={i} size={20 + i * 4} color={C.gold}
            style={{ position: "absolute", top: 10 + (i % 2) * 120, left: i < 2 ? -6 : size - 26,

        ))}
        <LottieView src={lottiePick} size={size} loop={mood === "idle"} onFail={() => setLottieErr(true)} />
      </div>
    );
  }
  // ② 画像があればそれを表示（読み込み失敗時は下のSVGに自動フォールバック）
  if (src && !imgErr) {
    return (
      <div style={{ width: size, height: size, position: "relative" }}>

          <Sparkles key={i} size={20 + i * 4} color={C.gold}

        {/* 猫耳 */}

        <path d="M148 56 L160 16 L116 44 Z" fill="url(#ha)" />
        <path d="M54 50 L48 28 L74 44 Z" fill={C.pink} opacity=".8" />
        <path d="M146 50 L152 28 L126 44 Z" fill={C.pink} opacity=".8" />
        {/* 体・セーラー */}
        <path d="M58 150 Q100 130 142 150 L150 196 Q100 208 50 196 Z" fill="url(#ha)" />
        <path d="M70 142 L100 168 L130 142 L122 178 L78 178 Z" fill="#fbf7ff" />

        {/* 目 */}
        <ellipse cx="80" cy="104" rx="9" ry="12" fill="#2b1f4a" />

}

/* ---- 数学の「型＋ランダムな数」で標準問題をつくる共通部品（フェーズ4）----
   term(係数, 文字, 先頭か)：2x / -x / x のような項の表示。先頭以外は " + 2x" / " - x" の形。
   cst(定数)：" + 5" / " - 3"（0 のときは空）。
   nz(lo, hi)：0 をのぞいた整数。 */
function term(k, v, first) {
  const abs = Math.abs(k);
  const body = (abs === 1 ? "" : String(abs)) + v;
  if (first) return (k < 0 ? "-" : "") + body;
  return (k < 0 ? " - " : " + ") + body;
}
function cst(n) { return n === 0 ? "" : (n > 0 ? ` + ${n}` : ` - ${-n}`); }
function nz(lo, hi) { let n = 0; while (n === 0) n = rint(lo, hi); return n; }
function pickOne(arr) { return arr[rint(0, arr.length - 1)]; }

/* 正負の数の標準：型を7つ持ち、数はその場で決める。4回に1回は固定の HYOJUN からも出す。
   答えはすべて整数（わり算は割り切れる数だけ作る）。tools/verify.mjs が式を計算して検算する。 */
function genStd_seifu(level) {
  if (Math.random() < 0.25) return genFromPool(HYOJUN);
  const t = rint(1, 7);
  let q, a;
  if (t === 1) {        // 3つの数のたし算・ひき算
    const x = nz(-15, 15), y = nz(-15, 15), z = nz(-15, 15);
    const o1 = pickOne(["+", "-"]), o2 = pickOne(["+", "-"]);
    q = `${fmt(x)} ${o1} ${fmt(y)} ${o2} ${fmt(z)}`;
    a = (o1 === "+" ? x + y : x - y); a = (o2 === "+" ? a + z : a - z);
  } else if (t === 2) { // 2つの数のかけ算（どちらかは負）
    const x = nz(-9, 9), y = rint(2, 9) * (x > 0 ? -1 : pickOne([1, -1]));
    q = `${fmt(x)} × ${fmt(y)}`; a = x * y;
  } else if (t === 3) { // わり算（割り切れる）
    const d = rint(2, 9) * pickOne([1, -1]), ans = nz(-9, 9);
    q = `${fmt(d * ans)} ÷ ${fmt(d)}`; a = ans;
  } else if (t === 4) { // 3つの数のかけ算
    const x = nz(-5, 5), y = nz(-5, 5), z = nz(-4, 4);
    q = `${fmt(x)} × ${fmt(y)} × ${fmt(z)}`; a = x * y * z;
  } else if (t === 5) { // 累乗：(-n)² / -n² / (-n)³ / -n³
    const f = rint(1, 4), n = f <= 2 ? rint(2, 6) : rint(2, 4);
    if (f === 1) { q = `(-${n})²`; a = n * n; }
    else if (f === 2) { q = `-${n}²`; a = -n * n; }
    else if (f === 3) { q = `(-${n})³`; a = -n * n * n; }
    else { q = `-${n}³`; a = -n * n * n; }
  } else if (t === 6) { // 絶対値
    const x = nz(-12, 12), y = nz(-12, 12), f = rint(1, 3);
    if (f === 1) { q = `|${x}| + |${y}|`; a = Math.abs(x) + Math.abs(y); }
    else if (f === 2) { q = `|${x}| - |${y}|`; a = Math.abs(x) - Math.abs(y); }
    else { q = `|${x} - ${fmt(y)}|`; a = Math.abs(x - y); }
  } else {              // 四則の混じった計算（かけ算を先に）
    const x = nz(-6, 6), y = nz(-6, 6), z = nz(-12, 12);
    if (Math.random() < 0.5) { q = `${fmt(x)} × ${fmt(y)} + ${fmt(z)}`; a = x * y + z; }
    else { q = `${fmt(z)} - ${fmt(x)} × ${fmt(y)}`; a = z - x * y; }
  }
  return { q, a, kind: "標準" };
}
const genHyojun = () => ({ ...HYOJUN[rint(0, HYOJUN.length - 1)], kind: "標準" });

function shuffle(arr) { return arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]); }
function makeChoices(answer) {
  const set = new Set([answer]);
  const cands = [-answer, answer + 1, answer - 1, answer + 2, answer - 2, answer + (answer === 0 ? 3 : 0)];
  for (const c of shuffle(cands)) { if (set.size >= 4) break; if (!set.has(c)) set.add(c); }
  let g = 1; while (set.size < 4) { set.add(answer + g * 3); set.add(answer - g * 3); g++; }
  return shuffle([...set].slice(0, 4));
}

/* 回答方式の決定：答えが整数の問題だけ「入力」にできる（分数・小数・式は4択）。
   レベルが上がるほど入力の比率を上げる（Lv1-2=4択のみ / Lv3-4=約30% / Lv5+=約50%）。 */
function pickAnswerMode(level, ans) {
  if (!Number.isInteger(ans)) return "choice";
  const p = level >= 5 ? 0.5 : level >= 3 ? 0.3 : 0;
  return Math.random() < p ? "input" : "choice";
}

/* 入力をやさしく解釈：全角数字・全角マイナス・空白を吸収して整数に */
function parseInput(s) {
  if (s == null) return null;
  let t = String(s).trim()
    .replace(/[０-９]/g, d => "０１２３４５６７８９".indexOf(d).toString())
    .replace(/[ー－−—‐]/g, "-")
    .replace(/[＋]/g, "+")
    .replace(/\s/g, "");
  if (t === "" || t === "-" || t === "+") return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/* ----- 文字式 v1：式の値（代入）。答えはすべて整数 ----- */
/* 超基本：x に数を代入して値を求める問題を無限生成（1次・係数は正） */
function genKihon_moji(level) {
  const vars = ["x", "a", "y"];
  const vname = vars[rint(0, vars.length - 1)];
  const k = rint(1, Math.min(3 + level, 6)); // 係数（正）
  const b = rint(-9, 9);                       // 定数
  const v = rint(-6, 6);                        // 代入する値
  const coef = (k === 1) ? vname : `${k}${vname}`;
  const cons = (b === 0) ? "" : (b > 0 ? ` + ${b}` : ` - ${-b}`);
  return { q: `${vname} = ${v} のとき　${coef}${cons} の値`, a: k * v + b, kind: "超基本" };
}

/* 文字式の標準：型＋ランダムな数（フェーズ4）。4回に1回は固定の MOJI からも出す。答えはすべて整数。 */
function genStd_moji(level) {
  if (Math.random() < 0.25) return genFromPool(MOJI);
  const t = rint(1, 4);
  const v = pickOne(["x", "a", "y"]);
  const val = nz(-5, 5);
  if (t === 1) {        // 負の係数をふくむ1次式
    const k = nz(-6, 6), b = rint(-9, 9);
    return { q: `${v} = ${val} のとき　${term(k, v, true)}${cst(b)} の値`, a: k * val + b, kind: "標準" };
  }
  if (t === 2) {        // 定数が先：6 - 2x
    const b = rint(1, 12), k = rint(1, 5);
    return { q: `${v} = ${val} のとき　${b}${term(-k, v, false)} の値`, a: b - k * val, kind: "標準" };
  }
  if (t === 3) {        // 2乗をふくむ式
    const k = pickOne([1, 2, 3, -1, -2]), b = rint(-6, 6), w = rint(-4, 4) || 2;
    return { q: `${v} = ${w} のとき　${term(k, v + "²", true)}${cst(b)} の値`, a: k * w * w + b, kind: "標準" };
  }
  // 2つの文字
  const [p, r] = pickOne([["x", "y"], ["a", "b"]]);
  const pv = nz(-5, 5), rv = nz(-5, 5), k1 = nz(-4, 4), k2 = nz(-4, 4);
  return { q: `${p} = ${pv}, ${r} = ${rv} のとき　${term(k1, p, true)}${term(k2, r, false)} の値`, a: k1 * pv + k2 * rv, kind: "標準" };
}

/* ----- 方程式 v1：1次方程式。答え（解 x）はすべて整数 ----- */
/* 超基本：ax + b = c の形を無限生成（解は整数）。「…を解くと、x」の後にUIが「=」を付ける */
function genKihon_houtei(level) {
  const sol = rint(-6, 6);                         // 解 x（答え）
  const co = rint(2, Math.min(2 + level, 5));      // 係数（2以上）
  const bb = rint(-9, 9);                           // 定数
  const c = co * sol + bb;                          // 右辺
  const bCons = (bb === 0) ? "" : (bb > 0 ? ` + ${bb}` : ` - ${-bb}`);
  return { q: `${co}x${bCons} = ${c} を解くと、x`, a: sol, kind: "超基本" };
}

/* 方程式の標準：型＋ランダムな数（フェーズ4）。4回に1回は固定の HOUTEI からも出す。
   解（答え）を先に決めてから式を作るので、解はいつも整数。tools/verify.mjs が代入して検算する。 */
function genStd_houtei(level) {
  if (Math.random() < 0.25) return genFromPool(HOUTEI);
  const sol = rint(-6, 6);
  const t = rint(1, 3);
  if (t === 1) {        // 両辺に x：ax + b = cx + d
    const a = rint(2, 7);
    let c = nz(-3, 5); if (c === a) c = a - 1 || -1;
    const b = rint(-9, 9), d = a * sol + b - c * sol;
    return { q: `${term(a, "x", true)}${cst(b)} = ${term(c, "x", true)}${cst(d)} を解くと、x`, a: sol, kind: "標準" };
  }
  if (t === 2) {        // かっこ：k(x + m) = n
    const k = rint(2, 5), m = nz(-6, 6), n = k * (sol + m);
    return { q: `${k}(x${cst(m)}) = ${n} を解くと、x`, a: sol, kind: "標準" };
  }
  // 定数から x をひく：n - kx = c
  const n = rint(3, 15), k = rint(1, 4), c = n - k * sol;
  return { q: `${n}${term(-k, "x", false)} = ${c} を解くと、x`, a: sol, kind: "標準" };
}

/* セーブの引き継ぎ：セーブはFirebaseの users/{端末ID} にあり、端末IDはこの端末のlocalStorageにだけある。
   ホーム画面のアイコンを消すと端末IDが消えて新規扱いになるため、番号の確認と切り替えをここでできるようにする。
   iOSのホーム画面アプリでは window.confirm が効かないことがあるので、2回タップで確定する。 */
function DeviceTransfer() {
  const cur = getDeviceId();
  const [v, setV] = useState("");
  const [msg, setMsg] = useState("");
  const [armed, setArmed] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(cur); setMsg("今の番号をコピーしました。メモ帳などに保存しておいてください"); }
    catch (e) { setMsg("コピーできませんでした。番号を長押しして選んでください"); }
  };
  const apply = () => {
    const id = v.trim();
    if (!/^dev-[0-9a-z-]{8,}$/i.test(id)) { setMsg("番号の形がちがいます。dev- で始まる番号をそのまま貼り付けてください"); setArmed(false); return; }
    if (id === cur) { setMsg("今と同じ番号です"); setArmed(false); return; }
    if (!armed) { setArmed(true); setMsg("もう一度押すと切り替えて再起動します（今のセーブは使われなくなります）"); setTimeout(() => setArmed(false), 5000); return; }
    try { localStorage.setItem("rino_device_id", id); localStorage.setItem("rino_force_migrate", "1"); }
    catch (e) { setMsg("保存できませんでした"); return; }
    location.reload();
  };
  const box = { background: "#1b1828", border: "1px solid #34304a", borderRadius: 12, padding: 12, marginBottom: 14 };
  const btn = { border: "none", borderRadius: 8, padding: "7px 12px", fontWeight: 800, cursor: "pointer", fontSize: 12 };
  return (
    <div style={box}>
      <div style={{ fontWeight: 800, color: "#ffd56b", fontSize: 13, marginBottom: 6 }}>セーブの引き継ぎ</div>
      <div style={{ fontSize: 11, color: "#8a83a8", marginBottom: 4 }}>この端末の番号（控えておけばアイコンを消しても戻せます）</div>
      <div style={{ fontSize: 11, color: "#cfc7e6", wordBreak: "break-all", userSelect: "all", WebkitUserSelect: "all", marginBottom: 6 }}>{cur}</div>
      <button onClick={copy} style={{ ...btn, background: "#2a2740", color: "#cfc7e6", marginBottom: 10 }}>番号をコピー</button>
      <div style={{ fontSize: 11, color: "#8a83a8", marginBottom: 4 }}>前の番号に切り替える</div>
      <input value={v} onChange={e => { setV(e.target.value); setArmed(false); }} placeholder="dev-xxxxxxxx-xxxx-..."
        autoCapitalize="off" autoCorrect="off" spellCheck={false}
        style={{ width: "100%", boxSizing: "border-box", background: "#0e0c16", color: "#cfc7e6", border: "1px solid #34304a",
          borderRadius: 8, padding: "8px 10px", fontSize: 16, marginBottom: 8, fontFamily: "inherit" }} />
      <button onClick={apply} style={{ ...btn, background: armed ? "#e8a33a" : "#8be9c0", color: "#12101c" }}>
        {armed ? "もう一度押して確定" : "この番号に切り替える"}
      </button>
      {msg && <div style={{ fontSize: 11, color: "#ffd56b", marginTop: 8, lineHeight: 1.5 }}>{msg}</div>}
    </div>
  );
}

/* アカウント（親用）：匿名セーブにメール＋パスワードを登録しておくと、アイコンを消しても・別のiPhoneでも同じセーブに戻れる。
   ⚠ いまはdevパネルの中にある。DEV_PANEL_ENABLED を false にする前に、親が使える場所へ移すこと */
function AccountBox() {
  const [, force] = useState(0);
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [armed, setArmed] = useState(false);
  const linked = fb.uid && !fb.isAnonymous;
  const status = !fb.uid ? "ログインしていません（Firebaseの設定待ち。今は端末IDで保存中）"
    : linked ? "登録済み：" + fb.email : "匿名でログイン中（メール未登録）";
  const check = () => {
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())) { setMsg("メールアドレスの形がちがいます"); return false; }
    if (pw.length < 6) { setMsg("パスワードは6文字以上にしてください"); return false; }
    return true;
  };
  const doRegister = async () => {
    if (!check()) return;
    setBusy(true); setMsg("");
    try { await registerEmail(email, pw); setPw(""); setMsg("登録しました。このメールとパスワードを忘れないように控えてください"); force(n => n + 1); }
    catch (e) { setMsg(authErrorText(e)); }
    setBusy(false);
  };
  const doLogin = async () => {
    if (!check()) return;
    if (!armed) { setArmed(true); setMsg("もう一度押すとログインして再起動します（いまのセーブからそのメールのセーブに切り替わります）"); setTimeout(() => setArmed(false), 5000); return; }
    setBusy(true); setMsg("");
    try { await loginEmail(email, pw); location.reload(); }
    catch (e) { setMsg(authErrorText(e)); setArmed(false); setBusy(false); }
  };
  const box = { background: "#1b1828", border: "1px solid #34304a", borderRadius: 12, padding: 12, marginBottom: 14 };
  const btn = { border: "none", borderRadius: 8, padding: "7px 12px", fontWeight: 800, cursor: "pointer", fontSize: 12, marginRight: 8, marginBottom: 6 };
  const inp = { width: "100%", boxSizing: "border-box", background: "#0e0c16", color: "#cfc7e6", border: "1px solid #34304a",
    borderRadius: 8, padding: "8px 10px", fontSize: 16, marginBottom: 8, fontFamily: "inherit" };
  return (
    <div style={box}>

      <div style={{ fontSize: 11, color: linked ? "#9fe8c6" : "#cfc7e6", marginBottom: 8, lineHeight: 1.5 }}>{status}</div>
      <div style={{ fontSize: 11, color: "#8a83a8", marginBottom: 8, lineHeight: 1.5 }}>
        メールとパスワードを登録しておくと、アイコンを消しても・別のiPhoneでも「ログイン」で同じセーブに戻れます。
      </div>
      <input type="email" value={email} onChange={e => { setEmail(e.target.value); setArmed(false); }} placeholder="メールアドレス"
        autoCapitalize="off" autoCorrect="off" spellCheck={false} style={inp} />
      <input type="password" value={pw} onChange={e => { setPw(e.target.value); setArmed(false); }} placeholder="パスワード（6文字以上）" style={inp} />
      {fb.uid && !linked && (
        <button disabled={busy} onClick={doRegister} style={{ ...btn, background: "#8be9c0", color: "#12101c" }}>このセーブに登録</button>
      )}
      <button disabled={busy} onClick={doLogin} style={{ ...btn, background: armed ? "#e8a33a" : "#2a2740", color: armed ? "#12101c" : "#cfc7e6" }}>

/* ================= メインアプリ ================= */
function Rinogical() {
  const [screen, setScreen] = useState("loading");
  const [tip] = useState(() => { const a = t("tips"); return a[rint(0, a.length - 1)]; });
  const [character, setCharacter] = useState(null);
  const [nickname, setNickname] = useState("");
  // coins は全科目共通。level/xp は科目ごと（数学・英語…）に分けて持つ
  const [player, setPlayer] = useState({ coins: 0, subjects: { math: { level: 1, xp: 0 }, english: { level: 1, xp: 0 }, kokugo: { level: 1, xp: 0 }, rika: { level: 1, xp: 0 }, shakai: { level: 1, xp: 0 } } });
  const [subject, setSubject] = useState("math"); // いまプレイ中の科目
  const [unit, setUnit] = useState("seifu");       // いまの単元（数学：正負の数 / 文字式 … 国語：漢字 …）
  const [battleReturn, setBattleReturn] = useState("trials"); // バトル後の戻り先
  const prog = (player.subjects && player.subjects[subject]) || { level: 1, xp: 0 };
  const deviceIdRef = useRef(null);
  const persistReady = useRef(false); // 初回読込が終わるまで保存しない（既存データの上書き防止）

  // 背景画像：読み込めたときだけ切り替える（無ければ今までのグラデーションのまま）
  const [bgUrl, setBgUrl] = useState(null);
  useEffect(() => {
    const url = assetUrl(ASSETS.backgrounds && ASSETS.backgrounds.adventure);
    if (!url) return;
    const im = new Image();
    im.onload = () => setBgUrl(url);
    im.src = url;
  }, []);

  /* 起動時：Firebase初期化 → デバイスID取得 → データ読込（無ければ初期設定へ） */
  useEffect(() => {
    let alive = true;
    (async () => {
      const sleep = new Promise(r => setTimeout(r, 1300)); // ローディング演出の最低表示時間
      await initFirebase();
      const { key, data } = await loadSaveData(); // ログインできればuid、できなければ端末IDに保存
      deviceIdRef.current = key;
      await sleep;
      if (!alive) return;
      if (data && data.nickname) {
        const ch = CHARACTERS.find(c => c.id === data.characterId)
          || { id: data.characterId || "myao", accent: data.characterAccent || C.lav };
        setNickname(data.nickname);
        setCharacter(ch);
        // 旧データ（level/xp が直接入っている）→ subjects.math へ自動で引っ越し
        let subjects;
        if (data.subjects && typeof data.subjects === "object") {
          subjects = {
            math: data.subjects.math || { level: 1, xp: 0 },
            english: data.subjects.english || { level: 1, xp: 0 },
            kokugo: data.subjects.kokugo || { level: 1, xp: 0 },
            rika: data.subjects.rika || { level: 1, xp: 0 },
            shakai: data.subjects.shakai || { level: 1, xp: 0 },
          };
        } else {
          subjects = {
            math: { level: data.level ?? 1, xp: data.xp ?? 0 },
            english: { level: 1, xp: 0 },
            kokugo: { level: 1, xp: 0 },
            rika: { level: 1, xp: 0 },
            shakai: { level: 1, xp: 0 },
          };
        }
        setPlayer({ coins: data.coins ?? 0, subjects });
        setScreen("home"); // 続きから
      } else {
        setScreen("character"); // 新規：初期設定へ
      }
      persistReady.current = true; // ここから保存を有効化
    })();
    return () => { alive = false; };
  }, []);

  /* 保存タイミング：レベルアップ・コイン増加・XP変化（=playerの変化）／ニックネーム・キャラ確定時 */
  useEffect(() => {
    if (!persistReady.current) return;
    if (!nickname || !character) return;
    const ch = character || {};
    saveUserData(deviceIdRef.current, {
      nickname,
      characterId: ch.id || null,
      characterAccent: ch.accent || null,
      coins: player.coins,
      subjects: player.subjects,
      // 互換用（古い形式しか見ない処理があっても困らないように、数学の値を残す）
      level: (player.subjects.math || {}).level ?? 1,
      xp: (player.subjects.math || {}).xp ?? 0,
    });
  }, [player, nickname, character]);

  const font = { fontFamily: "'Hiragino Maru Gothic ProN','Yu Gothic UI','M PLUS Rounded 1c',system-ui,sans-serif" };
  const baseGrad = `radial-gradient(1200px 500px at 50% -10%, ${C.bg2}, ${C.bg0} 70%)`;
  // 背景画像が読めた時だけ：上に薄暗いベールを重ねて文字を読みやすくする
  const bgStyle = bgUrl
    ? `linear-gradient(rgba(11,8,26,.30), rgba(11,8,26,.52)), url("${bgUrl}") center/cover no-repeat, ${baseGrad}`
    : baseGrad;

  return (
    <div style={{ ...font, minHeight: "100vh", boxSizing: "border-box", color: C.ink, position: "relative", overflow: "hidden",
      background: bgStyle,
      // iPhoneのホーム画面アプリは時計・電波表示の下まで広がるので、その分（safe-area）を上下に足す
      padding: "calc(env(safe-area-inset-top, 0px) + 26px) 18px calc(env(safe-area-inset-bottom, 0px) + 26px)",
      borderRadius: 24 }}>
      <Keyframes />
      {/* 背景のルーン */}
      {["✦", "✧", "⚝", "❉", "✺", "✦"].map((r, i) => (
        <span key={i} style={{ position: "absolute", color: C.aqua, fontSize: 16 + (i % 3) * 8,
          left: `${(i * 17 + 5) % 92}%`, top: `${(i * 23 + 8) % 88}%`, animation: `rino-rune ${4 + i}s ease-in-out infinite`, pointerEvents: "none" }}>{r}</span>
      ))}

      <div style={{ maxWidth: 460, margin: "0 auto", position: "relative" }}>
        {screen === "loading" && <Loading tip={tip} />}
        {screen === "character" && <CharacterSelect onPick={(c) => { setCharacter(c); setScreen("name"); }} />}
        {screen === "name" && (
          <NameInput accent={character?.accent} imgSrc={assetUrl(character?.img)}
            nickname={nickname} setNickname={setNickname}
            onNext={() => setScreen("tutorial")} />
        )}
        {screen === "tutorial" && <Tutorial char={character} nickname={nickname} onStart={() => setScreen("home")} />}
        {screen === "home" && <SubjectHome char={character} coins={player.coins} nickname={nickname}
          onMath={() => { setSubject("math"); setScreen("trials"); }}
          onEnglish={() => { setSubject("english"); setBattleReturn("home"); setScreen("battle"); }}
          onKokugo={() => { setSubject("kokugo"); setScreen("trials"); }}
          onRika={() => { setSubject("rika"); setBattleReturn("home"); setScreen("battle"); }}
          onShakai={() => { setSubject("shakai"); setBattleReturn("home"); setScreen("battle"); }} />}
        {screen === "trials" && <Home char={character} level={prog.level} coins={player.coins} nickname={nickname} subjectKey={subject}
          onBoss={(i) => { const R = SUBJECT_ROOMS[subject] || SUBJECT_ROOMS.math; setUnit(R.keys[i] || R.keys[0]); setBattleReturn("trials"); setScreen("battle"); }} onBack={() => setScreen("home")} />}
        {screen === "battle" && (
          <Battle char={character} player={player} setPlayer={setPlayer} subjectKey={subject} unitKey={unit} prog={prog} nickname={nickname}
            onWin={() => setScreen("victory")} onHome={() => setScreen(battleReturn)} />
        )}
        {screen === "victory" && <Victory char={character} level={prog.level} coins={player.coins} nickname={nickname} onHome={() => setScreen(battleReturn)} />}
      </div>
    </div>
  );
}

          <button key={i} className="rino-btn" disabled={!r.open} onClick={r.open ? () => onBoss(i) : undefined}

              display: "flex", alignItems: "center", gap: 12, cursor: r.open ? "pointer" : "default", opacity: r.open ? 1 : .55,
              ...(r.open ? { animation: "rino-glow 2.6s ease-in-out infinite" } : {}) }}>
            <div style={{ fontSize: 30 }}>{r.open ? "🗝️" : <Lock size={26} color={C.inkDim} />}</div>
            <div>
              <div style={{ fontWeight: 900, fontSize: 16, color: r.open ? C.aqua : C.inkDim }}>{r.name}</div>
              <div style={{ fontSize: 12, color: C.inkDim }}>{r.sub}</div>
            </div>
          </button>
        ))}
      </div>

      {onBack && (
        <div style={{ textAlign: "center", marginTop: 16 }}>
          <button onClick={onBack} className="rino-btn"
            style={{ background: "transparent", border: "none", color: C.inkDim, fontWeight: 700,
              fontSize: 13, cursor: "pointer", textDecoration: "underline" }}>
            {t("backToSubjects")}
          </button>
        </div>
      )}

      {/* 開発者用：小さめ・薄色の隠しボタン。画面（ビューポート）の右下に固定。DEV_PANEL_ENABLED=false で消える */}
      {DEV_PANEL_ENABLED && (

          style={{ position: "fixed", right: 6, bottom: "calc(env(safe-area-inset-bottom, 0px) + 6px)", zIndex: 40,
            width: 40, height: 26, padding: 0, background: "rgba(0,0,0,.25)", border: "none", borderRadius: 8,
            color: "rgba(255,255,255,.35)", fontSize: 11, fontWeight: 700, letterSpacing: .5, cursor: "pointer", lineHeight: "26px" }}>
          dev
        </button>
      )}
      {DEV_PANEL_ENABLED && devOpen && <DevPanel onClose={() => setDevOpen(false)} />}
    </div>
  );
}

/* ---------- バトル ---------- */
const BOSS_HP = 100, PLAYER_HP = 100, HIT_DMG = 25, TAKE_DMG = 20;

/* 問題文の中の「答える対象の言葉」だけを目立たせる表示部品。
   ・mark を持つのは今のところ国語だけ。数学・英語・理科は mark が無いので、
     下の if で全文をそのまま返す＝表示はこれまでとまったく同じになる。
   ・mark が文中に見つからないときも全文表示に戻す。文章が欠けることは起きない。 */
function MarkedText({ text, mark }) {
  const i = mark ? String(text).indexOf(mark) : -1;
  if (i < 0) return <>{text}</>;
  return (
    <>
      {text.slice(0, i)}
      <span style={{ color: C.gold, borderBottom: `3px solid ${C.gold}`, padding: "0 2px" }}>{mark}</span>
      {text.slice(i + mark.length)}
    </>
  );
}

function Battle({ char, player, setPlayer, subjectKey, unitKey, prog, nickname, onWin, onHome }) {
  // 数学のときは単元（正負の数 / 文字式 …）の設定 U を読む。英語のときは U=null。
  const U = subjectKey === "math" ? (MATH_UNITS[unitKey] || MATH_UNITS.seifu) : null;
  // 国語のときは部屋（漢字 …）の設定 KU を読む（39_kokugo_units.jsx）
  const KU = subjectKey === "kokugo" ? (KOKUGO_UNITS[unitKey] || KOKUGO_UNITS.kanji) : null;
  const meta = U
    ? { ...SUBJECT_META.math, bossName: U.bossName, tokens: U.tokens, explain: U.explain }
    : KU
    ? { ...SUBJECT_META.kokugo, bossName: KU.bossName, tokens: KU.tokens, explain: KU.explain }
    : (SUBJECT_META[subjectKey] || SUBJECT_META.math);
  const [bossHP, setBossHP] = useState(BOSS_HP);
  const [hp, setHp] = useState(PLAYER_HP);
  const [problem, setProblem] = useState(null);
  const [choices, setChoices] = useState([]);
  const [mood, setMood] = useState("idle");
  const [bossHit, setBossHit] = useState(false);
  const [phase, setPhase] = useState("loading"); // loading | answer | result
  const [picked, setPicked] = useState(null);
  const [mode, setMode] = useState("choice");   // "choice" | "input" | "arrange"
  const [inputVal, setInputVal] = useState("");
  const [built, setBuilt] = useState([]);        // 並べ替え：選んだ札の並び
  const [explain, setExplain] = useState("");
  const [explaining, setExplaining] = useState(false);
  const convo = useRef([]);

  async function nextProblem() {
    setPhase("loading"); setPicked(null); setExplain(""); setMood("idle"); setBuilt([]);
    let p;
    const lv = prog.level;
    if (subjectKey === "english") {
      p = genEnglishProblem(lv);
    } else if (subjectKey === "kokugo") {
      p = KU.gen(lv);
    } else if (subjectKey === "rika") {
      p = genRikaProblem(lv);
    } else if (subjectKey === "shakai") {
      p = genShakaiProblem(lv);
    } else {
      const roll = Math.random();
      try {
        if (lv >= 5 && roll < 0.5) p = await U.genOyou(lv);
        else if (lv >= 3 && roll < 0.7) p = U.genStd ? U.genStd(lv) : genFromPool(U.pool); // 標準：型＋ランダムな数
        else p = U.genKihon(lv);
      } catch { p = genFromPool(U.pool); }
      p.type = "number";
      p.ui = pickAnswerMode(lv, p.a);
    }
    const ch = p.choices || (p.type === "number" ? makeChoices(p.a) : []);
    setProblem(p); setChoices(ch);
    setMode(p.ui || "choice"); setInputVal("");
    setPhase("answer");
  }
  useEffect(() => { nextProblem(); /* eslint-disable-next-line */ }, []);

  async function fetchExplain(extra) {
    setExplaining(true);
    try {
      if (convo.current.length === 0) {
        convo.current = [{ role: "user", content: `問題：${problem.q || problem.a}　正解：${problem.a}。生徒が間違えました。まずは2〜3行だけ。やさしい励ましと、答えにつながる小さなヒントを1つだけ伝えて。くわしい手順はまだ書かないで。` }];
      } else if (extra) {
        convo.current.push({ role: "user", content: extra });
      }
      const txt = await callClaude(convo.current, meta.explain);
      convo.current.push({ role: "assistant", content: txt });
      setExplain(txt);
    } catch {
      setExplain(subjectKey === "english" ? localExplainEn(problem) : subjectKey === "kokugo" ? KU.localExplain(problem) : subjectKey === "rika" ? localExplainRika(problem) : subjectKey === "shakai" ? localExplainShakai(problem) : (U ? U.localExplain(problem) : localExplain(problem)));
    } finally { setExplaining(false); }
  }

  function answer(val) {
    if (phase !== "answer") return;
    setPicked(val);
    const correct = sameAns(val, problem);
    setPhase("result");
    if (correct) {
      setMood("happy");
      setBossHit(true); setTimeout(() => setBossHit(false), 500);
      const nb = Math.max(0, bossHP - HIT_DMG); setBossHP(nb);
      setPlayer(pl => {
        const cur = (pl.subjects && pl.subjects[subjectKey]) || { level: 1, xp: 0 };
        const xp = cur.xp + 1;
        const need = cur.level * 3;
        const coins = pl.coins + 10;
        const nextCur = xp >= need ? { level: cur.level + 1, xp: 0 } : { level: cur.level, xp };
        return { ...pl, coins, subjects: { ...pl.subjects, [subjectKey]: nextCur } };
      });
      if (nb <= 0) { setTimeout(onWin, 900); }
    } else {
      setMood("sad");
      setHp(h => Math.max(0, h - TAKE_DMG));
      convo.current = [];
      fetchExplain();
    }
  }

  function submitInput() {
    if (phase !== "answer") return;
    if (problem.type === "number") {
      const v = parseInput(inputVal);
      if (v === null) return; // 空や記号だけのときは何もしない
      answer(v);
    } else {
      const s = inputVal.trim();
      if (s === "") return;
      answer(s);
    }
  }
  function toggleSign() {
    setInputVal(s => (s.startsWith("-") ? s.slice(1) : "-" + s));
  }
  // 並べ替え：札をタップで追加／取り消し
  function pickTile(i) {
    if (phase !== "answer") return;
    if (built.includes(i)) return;
    setBuilt(b => [...b, i]);
  }
  function undoTile() {
    if (phase !== "answer") return;
    setBuilt(b => b.slice(0, -1));
  }
  function submitArrange() {
    if (phase !== "answer" || built.length === 0) return;
    const sentence = built.map(i => problem.tiles[i]).join(" ");
    answer(sentence);
  }

  const dead = hp <= 0;

  return (
    <div style={{ animation: "rino-pop .35s ease" }}>
      <HUD level={prog.level} coins={player.coins} name={nickname} />
      <div style={{ ...clay(C.bg1), padding: 14, marginBottom: 12 }}>
        <div style={{ textAlign: "center", fontWeight: 900, color: C.danger, marginBottom: 4 }}>👾 {meta.bossName}</div>
        <DarkNumber hit={bossHit} tokens={meta.tokens} />
        <HPBar label={t("bossHP")} value={bossHP} max={BOSS_HP} color={C.danger} />
      </div>

      <div style={{ display: "flex", alignItems: "flex-end", gap: 10, marginBottom: 10 }}>
        <Hero accent={char?.accent} mood={mood} size={92} src={assetUrl(char?.img)}
          lottieSet={char && char.id && LOTTIE.chars[char.id] ? {
            idle: assetUrl(LOTTIE.chars[char.id].idle),
            happy: assetUrl(LOTTIE.chars[char.id].happy),
            sad: assetUrl(LOTTIE.chars[char.id].sad),
          } : null} />
        <div style={{ flex: 1 }}><HPBar label={t("hpOf", nickname)} value={hp} max={PLAYER_HP} color={C.mint} /></div>
      </div>

      {dead ? (
        <div style={{ ...clay(C.bg1), padding: 18, textAlign: "center" }}>
          <p style={{ fontWeight: 800, marginBottom: 12 }}>{t("deadMsg")}<br />{t("deadMsg2")}</p>
          <Btn full bg={C.aqua} onClick={() => { setHp(PLAYER_HP); nextProblem(); }}>
            <RefreshCw size={18} style={{ verticalAlign: "-3px" }} /> {t("retry")}
          </Btn>
        </div>
      ) : phase === "loading" ? (
        <div style={{ ...clay(C.bg1), padding: 26, textAlign: "center" }}>
          <div style={{ margin: "0 auto 10px", width: 40, height: 40, borderRadius: "50%", border: `5px solid rgba(255,255,255,.12)`, borderTopColor: C.aqua, animation: "rino-spin 1s linear infinite" }} />
          <span style={{ color: C.inkDim, fontWeight: 700 }}>{t("callingProblem")}</span>
        </div>
      ) : (
        <div style={{ ...clay(C.bg1), padding: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontSize: 12, fontWeight: 800, color: C.bg0, background: C.butter, padding: "3px 10px", borderRadius: 999 }}>{problem.kind}</span>
            <span style={{ fontSize: 12, color: C.inkDim }}>{t("attackHint")}</span>
          </div>
          <div style={{ textAlign: "center", fontSize: problem.type === "number" ? 28 : 22, fontWeight: 900, margin: "10px 0 18px", letterSpacing: problem.type === "number" ? 1 : 0 }}>
            {mode === "arrange" ? t("arrangeHint") : <><MarkedText text={problem.q} mark={problem.mark} />{(problem.type === "number" && problem.kind !== "応用") ? " =" : ""}</>}
          </div>
          {mode === "arrange" ? (
            <div>
              <div style={{ ...clay(C.bg2, false), minHeight: 52, padding: "10px 12px", marginBottom: 10, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", justifyContent: "center" }}>
                {built.length === 0
                  ? <span style={{ color: C.inkDim, fontWeight: 700, fontSize: 13 }}>{t("arrangeTrayHint")}</span>
                  : built.map((ti, k) => (
                      <span key={k} style={{ ...clay(C.lav), padding: "6px 12px", fontWeight: 900, color: C.bg0, fontSize: 18 }}>{problem.tiles[ti]}</span>
                    ))}
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", marginBottom: 10 }}>
                {problem.tiles.map((w, i) => (
                  <button key={i} className="rino-btn" disabled={phase === "result" || built.includes(i)} onClick={() => pickTile(i)}
                    style={{ ...clay(built.includes(i) ? "#5b5080" : C.butter), border: "none", padding: "10px 14px", fontSize: 18, fontWeight: 900, color: C.bg0,
                      opacity: built.includes(i) ? .4 : 1, cursor: phase === "result" ? "default" : "pointer" }}>{w}</button>
                ))}
              </div>
              {phase !== "result"
                ? <div style={{ display: "flex", gap: 8 }}>
                    <Btn bg={C.peach} style={{ flex: "0 0 auto", padding: "12px 16px" }} onClick={undoTile}>{t("clearBtn")}</Btn>
                    <Btn full bg={C.lav} onClick={submitArrange}>{t("answerBtn")}</Btn>
                  </div>
                : <div style={{ textAlign: "center", fontWeight: 800, color: sameAns(picked, problem) ? C.mint : C.danger }}>
                    {t("yourAnswer")}{picked}{sameAns(picked, problem) ? t("correctMark") : t("answerWas", problem.a)}
                  </div>}
            </div>
          ) : mode === "input" ? (
            <div>
              {phase !== "result" && (
                <div style={{ fontSize: 12, color: C.inkDim, textAlign: "center", marginBottom: 8 }}>
                  {t(problem.type === "number" ? "inputHint" : "inputHintText")}
                </div>
              )}
              <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                {problem.type === "number" && (
                  <button className="rino-btn" onClick={toggleSign} disabled={phase === "result"}
                    style={{ ...clay(C.butter), border: "none", width: 56, fontSize: 22, fontWeight: 900, color: C.bg0, cursor: phase === "result" ? "default" : "pointer" }}>±</button>
                )}
                <input type="text" inputMode={problem.type === "number" ? "numeric" : "text"} value={inputVal}
                  onChange={e => setInputVal(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") submitInput(); }}
                  disabled={phase === "result"} placeholder={t("inputPlaceholder")}
                  style={{ ...clay(C.bg2, false), flex: 1, border: "none", outline: "none", color: C.ink, fontSize: 24, fontWeight: 900, textAlign: "center", padding: "12px 10px" }} />
              </div>
              {phase !== "result"
                ? <Btn full bg={C.lav} onClick={submitInput}>{t("answerBtn")}</Btn>
                : <div style={{ textAlign: "center", fontWeight: 800, color: sameAns(picked, problem) ? C.mint : C.danger }}>
                    {t("yourAnswer")}{picked}{sameAns(picked, problem) ? t("correctMark") : t("answerWas", problem.a)}
                  </div>}
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              {choices.map((c, i) => {
                const isCorrect = sameAns(c, problem), isPicked = c === picked;
                let bg = C.lav;
                if (phase === "result") { if (isCorrect) bg = C.mint; else if (isPicked) bg = C.danger; else bg = "#5b5080"; }
                return (
                  <button key={i} className="rino-btn" disabled={phase === "result"} onClick={() => answer(c)}
                    style={{ ...clay(bg), border: "none", padding: "16px 0", fontSize: 22, fontWeight: 900, color: C.bg0, cursor: phase === "result" ? "default" : "pointer" }}>
                    {c}
                  </button>
                );
              })}
            </div>
          )}

          {phase === "result" && sameAns(picked, problem) && (
            <div style={{ textAlign: "center", marginTop: 14 }}>
              <p style={{ color: C.mint, fontWeight: 900, fontSize: 18 }}>{t("correctPlus")} <Coins size={16} style={{ verticalAlign: "-2px" }} /></p>
              {bossHP > 0 && <Btn full bg={C.aqua} style={{ marginTop: 10 }} onClick={nextProblem}>{t("nextSpell")}</Btn>}
            </div>
          )}

          {phase === "result" && !sameAns(picked, problem) && (
            <ExplainPanel explain={explain} explaining={explaining} teacher={meta.teacher} teacherImg={meta.teacherImg} teacherEmoji={meta.emoji}
              onWhy={() => fetchExplain("「なんで？」と聞かれました。なぜその答えになるのか、考え方のステップを順番に、わかりやすく説明して。")}
              onEasier={() => fetchExplain(subjectKey === "english"
                ? "「もっとかんたんに」と言われました。主語による be動詞の見分け方を、別の身近な言い方で、いちばんやさしく説明して。同じ説明のくり返しは避けて。"
                : subjectKey === "kokugo"
                ? KU.easier
                : subjectKey === "rika"
                ? "「もっとかんたんに」と言われました。その用語の覚え方を、別の切り口（名前の漢字の意味、対になる用語とのセット、身近な植物での例えなど）から1つだけ選んで、いちばんやさしく説明して。同じ説明のくり返しは避けて。中学1年で習わない光合成や蒸散のくわしい話には立ち入らないで。"
                : subjectKey === "shakai"
                ? "「もっとかんたんに」と言われました。その用語の覚え方を、別の切り口（言葉の意味、地球儀や地図でのイメージ、対になる知識とのセットなど）から1つだけ選んで、いちばんやさしく説明して。同じ説明のくり返しは避けて。政治や歴史の話には立ち入らないで。"
                : "「もっとかんたんに」と言われました。これまでとは別の、身近なたとえ（温度計・エレベーターの階・おこづかいの貸し借りなど）を1つだけ使って、いちばんやさしく説明して。同じ説明のくり返しは避けて。")}
              onNext={nextProblem} />
          )}
        </div>
      )}

      <div style={{ textAlign: "center", marginTop: 12 }}>
        <button className="rino-btn" onClick={onHome} style={{ background: "none", border: "none", color: C.inkDim, fontWeight: 700, cursor: "pointer", textDecoration: "underline" }}>{t("backToTrials")}</button>
      </div>
    </div>
  );
}

/* AI解説パネル */
function ExplainPanel({ explain, explaining, onWhy, onEasier, onNext, teacher = TEACHER, teacherImg = null, teacherEmoji = null }) {
  const [imgErr, setImgErr] = useState(false);
  const avatar = teacherImg && !imgErr
    ? <img src={teacherImg} alt="" width={72} height={72} onError={() => setImgErr(true)}
        style={{ width: 72, height: 72, objectFit: "contain", display: "block" }} />
    : teacherEmoji
      ? <div style={{ fontSize: 52, lineHeight: 1 }}>{teacherEmoji}</div>
      : <Magi size={84} />;
  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "center", marginBottom: 6 }}>
        {avatar}
        <p style={{ color: C.peach, fontWeight: 900, textAlign: "left", margin: 0 }}>
          {teacher}：<br />{t("teacherIntro")}
        </p>
      </div>
      <div style={{ ...clay(C.bg2, false), padding: 16, minHeight: 70, fontSize: 14, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>
        {explaining && !explain ? (
          <span style={{ color: C.inkDim, display: "inline-flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 16, height: 16, borderRadius: "50%", border: `3px solid rgba(255,255,255,.15)`, borderTopColor: C.aqua, animation: "rino-spin 1s linear infinite", display: "inline-block" }} />
            {teacher}{t("thinking")}
          </span>
        ) : (
          <span><Lightbulb size={16} color={C.gold} style={{ verticalAlign: "-3px", marginRight: 4 }} />{explain}</span>
        )}
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        <Btn bg={C.butter} style={{ flex: 1, padding: "11px 0", fontSize: 14 }} onClick={onWhy} disabled={explaining}>{t("why")}</Btn>
        <Btn bg={C.peach} style={{ flex: 1, padding: "11px 0", fontSize: 14 }} onClick={onEasier} disabled={explaining}>{t("easier")}</Btn>
      </div>
      <Btn full bg={C.aqua} style={{ marginTop: 10 }} onClick={onNext}>{t("nextProblem")}</Btn>
    </div>
  );
}

/* ---------- 勝利 ---------- */
function Victory({ char, level, coins, nickname, onHome }) {
  // 勝利画面のキャラだけ Lottie を試す（無ければ従来の画像/SVGに自動で戻る）
  const heroLottie = char && char.id ? LOTTIE.chars[char.id] : null;
  const heroLottieSet = heroLottie ? {
    idle: assetUrl(heroLottie.idle), happy: assetUrl(heroLottie.happy), sad: assetUrl(heroLottie.sad),
  } : null;
  return (
    <div style={{ textAlign: "center", animation: "rino-pop .4s ease" }}>
      <div style={{ position: "relative" }}>
        <Hero accent={char?.accent} mood="happy" size={170} src={assetUrl(char?.img)} lottieSet={heroLottieSet} />
      </div>
      <h2 style={{ fontSize: 26, fontWeight: 900, color: C.gold, textShadow: `0 0 20px ${C.gold}` }}>{t("sealBroken")}</h2>
      <p style={{ color: C.inkDim, margin: "6px 0 18px" }}>{t("guardianReturned")}<br />{t("wellDone", nickname)}</p>
      <div style={{ ...clay(C.bg1), padding: 18, marginBottom: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-around", fontWeight: 900 }}>
          <span><Star size={18} color={C.butter} style={{ verticalAlign: "-3px" }} /> Lv.{level}</span>
          <span><Coins size={18} color={C.gold} style={{ verticalAlign: "-3px" }} /> {coins}</span>
          <span><Heart size={18} color={C.danger} style={{ verticalAlign: "-3px" }} /> {t("clear")}</span>
        </div>
      </div>
      <Btn full bg={C.aqua} onClick={onHome}>{t("backToTrialsBtn")}</Btn>
    </div>
  );
}
